name: Validate Sable 2.0.5 + Aero stack 1.3.1

on:
  push:
    branches:
      - 'agent/validate-sable-2.0.5-stack-1.3.1'
    paths:
      - '.github/workflows/validate-sable-2.0.5-stack-1.3.1.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-sable-2.0.5-stack-1.3.1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve exact runtime dependency versions
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon dependencies --configuration runtimeClasspath --console=plain | tee /tmp/dependencies.log
          grep -F 'dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.5' /tmp/dependencies.log
          grep -F 'dev.simulated_team.simulated:simulated-neoforge-1.21.1:1.3.1' /tmp/dependencies.log
          grep -F 'dev.eriksonn.aeronautics:aeronautics-neoforge-1.21.1:1.3.1' /tmp/dependencies.log
          grep -F 'dev.ryanhcode.offroad:offroad-neoforge-1.21.1:1.3.1' /tmp/dependencies.log

      - name: Clone exact Sable 2.0.5 release source
        run: |
          git clone https://github.com/ryanhcode/sable.git /tmp/sable
          git -C /tmp/sable checkout 6966d2928340de7631abcecf8549904b877df0a8
          test "$(git -C /tmp/sable rev-parse HEAD)" = '6966d2928340de7631abcecf8549904b877df0a8'

      - name: Add continuous-force JNI extension only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sable/sable_rapier/src/main/rust/rapier/src/lib.rs')
          text = p.read_text()
          marker = 'Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque'
          if marker in text:
              raise SystemExit('JNI extension unexpectedly already exists')
          text += r'''

/// Validation extension: adds one world-space force and torque contribution to a Sable rigid body.
#[unsafe(no_mangle)]
pub extern "system" fn Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque<'local>(
    _env: JNIEnv<'local>,
    _class: JClass<'local>,
    handle: jlong,
    id: jint,
    fx: jdouble,
    fy: jdouble,
    fz: jdouble,
    tx: jdouble,
    ty: jdouble,
    tz: jdouble,
    wake_up: jboolean,
) {
    with_handle(handle, |scene| {
        let sable_data = scene.sable_data.read().unwrap();
        let mut sim_data = scene.sim_data.write().unwrap();
        let rb = get_rigid_body_mut(&mut sim_data, &sable_data, id as LevelColliderID);
        rb.add_force(Vec3::new(fx as Real, fy as Real, fz as Real), wake_up > 0);
        rb.add_torque(Vec3::new(tx as Real, ty as Real, tz as Real), wake_up > 0);
    });
}
'''
          p.write_text(text)
          PY

      - name: Build patched Sable 2.0.5 natives
        working-directory: /tmp/sable
        run: |
          ./gradlew sable_rapier:buildImages
          ./gradlew sable_rapier:compileRust-windows-x86_64 sable_rapier:compileRust-linux-x86_64

      - name: Verify and install patched natives
        id: natives
        shell: bash
        run: |
          set -euxo pipefail
          LINUX=/tmp/sable/sable_rapier/src/main/rust/target/x86_64-unknown-linux-gnu/release/libsable_rapier.so
          WINDOWS=/tmp/sable/sable_rapier/src/main/rust/target/x86_64-pc-windows-msvc/release/sable_rapier.dll
          SYMBOL=Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque
          nm -D "$LINUX" | grep "$SYMBOL"
          strings "$WINDOWS" | grep "$SYMBOL"
          OUT=src/main/resources/natives/antikytheramechanism_sable_rapier
          mkdir -p "$OUT"
          cp "$LINUX" "$OUT/sable_rapier_x86_64_linux.so"
          cp "$WINDOWS" "$OUT/sable_rapier_x86_64_windows.dll"
          LINUX_SHA=$(sha256sum "$OUT/sable_rapier_x86_64_linux.so" | awk '{print $1}')
          WINDOWS_SHA=$(sha256sum "$OUT/sable_rapier_x86_64_windows.dll" | awk '{print $1}')
          echo "linux_sha=$LINUX_SHA" >> "$GITHUB_OUTPUT"
          echo "windows_sha=$WINDOWS_SHA" >> "$GITHUB_OUTPUT"
          file "$OUT/sable_rapier_x86_64_linux.so" "$OUT/sable_rapier_x86_64_windows.dll"

      - name: Build Antikythera against updated stack
        run: ./gradlew --no-daemon build --console=plain

      - name: Run full Simulated + Aeronautics + Offroad runtime
        id: runtime
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain 2>&1 | tee /tmp/gametest.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyse runtime compatibility
        id: analyse
        shell: bash
        run: |
          set -euo pipefail
          LOADED=false
          if grep -Fq "Loaded Antikythera patched Sable Rapier native 'sable_rapier_x86_64_linux.so'" /tmp/gametest.log; then
            LOADED=true
          fi
          COMPAT=/tmp/compat-errors.log
          grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|UnsatisfiedLinkError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading|Failed to start the minecraft server|NoSuchMethodError|NoSuchFieldError' /tmp/gametest.log \
            | grep -v 'org/jetbrains/annotations/ApiStatus\$ScheduledForRemoval' \
            > "$COMPAT" || true
          KNOWN_CREATE=false
          if grep -Fq 'Create contraption disappeared during its initialization ticks' /tmp/gametest.log; then
            KNOWN_CREATE=true
          fi
          if [ "$LOADED" = true ] && [ ! -s "$COMPAT" ]; then
            COMPAT_OK=true
          else
            COMPAT_OK=false
          fi
          echo "loaded=$LOADED" >> "$GITHUB_OUTPUT"
          echo "compat_ok=$COMPAT_OK" >> "$GITHUB_OUTPUT"
          echo "known_create_failure=$KNOWN_CREATE" >> "$GITHUB_OUTPUT"
          grep -Ei 'GameTest|test.*fail|failed|failure|exception|Create contraption disappeared' /tmp/gametest.log | tail -n 100 > /tmp/failure-extract.log || true

      - name: Write validation report
        if: always()
        shell: bash
        env:
          LINUX_SHA: ${{ steps.natives.outputs.linux_sha }}
          WINDOWS_SHA: ${{ steps.natives.outputs.windows_sha }}
          RUNTIME_EXIT: ${{ steps.runtime.outputs.exit_code }}
          NATIVE_LOADED: ${{ steps.analyse.outputs.loaded }}
          COMPAT_OK: ${{ steps.analyse.outputs.compat_ok }}
          KNOWN_CREATE_FAILURE: ${{ steps.analyse.outputs.known_create_failure }}
        run: |
          {
            echo '# Sable 2.0.5 + Aeronautics stack 1.3.1 validation'
            echo
            echo '- Sable source: `6966d2928340de7631abcecf8549904b877df0a8` (2.0.5)'
            echo '- Runtime Sable dependency: `2.0.5`'
            echo '- Simulated / Aeronautics / Offroad runtime: `1.3.1`'
            echo '- Create runtime: `6.0.10-280`'
            echo '- Patched Linux native SHA256: `'$LINUX_SHA'`'
            echo '- Patched Windows native SHA256: `'$WINDOWS_SHA'`'
            echo '- Patched Linux native loaded by production loader: `'$NATIVE_LOADED'`'
            echo '- ABI / mixin / mod-loading compatibility scan: `'$COMPAT_OK'`'
            echo '- GameTest Gradle exit code: `'$RUNTIME_EXIT'`'
            echo '- Known pre-existing Create contraption test failure observed: `'$KNOWN_CREATE_FAILURE'`'
            echo
            echo '## Compatibility errors'
            echo '```text'
            cat /tmp/compat-errors.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Runtime failure extract'
            echo '```text'
            cat /tmp/failure-extract.log 2>/dev/null || true
            echo '```'
          } > VALIDATION_SABLE_2_0_5_STACK_1_3_1.md

      - name: Commit validated natives and report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/main/resources/natives/antikytheramechanism_sable_rapier/sable_rapier_x86_64_linux.so \
            src/main/resources/natives/antikytheramechanism_sable_rapier/sable_rapier_x86_64_windows.dll \
            VALIDATION_SABLE_2_0_5_STACK_1_3_1.md
          git commit -m 'Materialize Sable 2.0.5 native validation results'
          git push origin HEAD:agent/validate-sable-2.0.5-stack-1.3.1

      - name: Fail validation on compatibility error
        if: always()
        shell: bash
        env:
          COMPAT_OK: ${{ steps.analyse.outputs.compat_ok }}
        run: |
          test "$COMPAT_OK" = true
