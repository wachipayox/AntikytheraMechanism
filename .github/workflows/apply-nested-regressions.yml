name: Apply Nested Regression Fixes

on:
  push:
    branches: ['agent/create-frame-rotation-regression-apply']

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact Git blob patch
        run: |
          git apply --check .agent/regression-v4.patch.gz < /dev/null || true
          gzip -t .agent/regression-v4.patch.gz
          gzip -dc .agent/regression-v4.patch.gz > /tmp/regression.patch
          git apply --check /tmp/regression.patch
          git apply /tmp/regression.patch
          git diff --check
      - name: Clean build and unit tests
        run: ./gradlew --no-daemon clean build
      - name: Commit source fixes
        run: |
          rm -rf .agent
          rm -f .github/workflows/agent-apply-regressions.yml .github/workflows/agent-export-current.yml .github/workflows/agent-runtime-validation.yml .github/workflows/apply-nested-regressions.yml
          git config user.name 'Wachii'
          git config user.email 'dani.alvarado.sosa@gmail.com'
          git add -A
          git commit -m 'Fix nested contraption frame regressions'
          git push origin HEAD:agent/create-frame-rotation-regression-apply
