name: Fast Sable 2.0.5 Linux native build

on:
  push:
    branches:
      - 'agent/validate-sable-2.0.5-stack-1.3.1'
    paths:
      - '.github/workflows/build-sable-2.0.5-linux-fast.yml'

permissions:
  contents: write

jobs:
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-sable-2.0.5-stack-1.3.1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Sable 2.0.5 and apply JNI extension
        id: source
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -rf /tmp/sable
          git clone --filter=blob:none https://github.com/ryanhcode/sable.git /tmp/sable 2>&1 | tee /tmp/source.log
          CLONE=${PIPESTATUS[0]}
          if [ "$CLONE" -eq 0 ]; then
            git -C /tmp/sable checkout 6966d2928340de7631abcecf8549904b877df0a8 2>&1 | tee -a /tmp/source.log
            CHECKOUT=${PIPESTATUS[0]}
          else
            CHECKOUT=99
          fi
          PATCH=99
          if [ "$CLONE" -eq 0 ] && [ "$CHECKOUT" -eq 0 ]; then
            python3 - <<'PY' 2>&1 | tee -a /tmp/source.log
          from pathlib import Path
          p = Path('/tmp/sable/sable_rapier/src/main/rust/rapier/src/lib.rs')
          text = p.read_text()
          marker = 'Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque'
          if marker in text:
              raise SystemExit('JNI extension already exists unexpectedly')
          text += r'''

#[unsafe(no_mangle)]
pub extern "system" fn Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque<'local>(
    _env: JNIEnv<'local>,
    _class: JClass<'local>,
    handle: jlong,
    id: jint,
    fx: jdouble,
    fy: jdouble,
    fz: jdouble,
    tx: jdouble,
    ty: jdouble,
    tz: jdouble,
    wake_up: jboolean,
) {
    with_handle(handle, |scene| {
        let sable_data = scene.sable_data.read().unwrap();
        let mut sim_data = scene.sim_data.write().unwrap();
        let rb = get_rigid_body_mut(&mut sim_data, &sable_data, id as LevelColliderID);
        rb.add_force(Vec3::new(fx as Real, fy as Real, fz as Real), wake_up > 0);
        rb.add_torque(Vec3::new(tx as Real, ty as Real, tz as Real), wake_up > 0);
    });
}
'''
          p.write_text(text)
          PY
            PATCH=${PIPESTATUS[0]}
          fi
          echo "clone=$CLONE" >> "$GITHUB_OUTPUT"
          echo "checkout=$CHECKOUT" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build zigbuild image
        id: image
        if: steps.source.outputs.clone == '0' && steps.source.outputs.checkout == '0' && steps.source.outputs.patch == '0'
        shell: bash
        working-directory: /tmp/sable
        run: |
          set +e
          set -o pipefail
          ./gradlew sable_rapier:buildZigbuildImage --console=plain 2>&1 | tee /tmp/image.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile Linux x86-64
        id: compile
        if: steps.image.outputs.code == '0'
        shell: bash
        working-directory: /tmp/sable
        run: |
          set +e
          set -o pipefail
          ./gradlew sable_rapier:compileRust-linux-x86_64 --console=plain 2>&1 | tee /tmp/compile.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify and copy Linux native
        id: verify
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set +e
          SOURCE=/tmp/sable/sable_rapier/src/main/rust/target/x86_64-unknown-linux-gnu/release/libsable_rapier.so
          SYMBOL=Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque
          CODE=0
          test -f "$SOURCE" || CODE=1
          if [ "$CODE" -eq 0 ]; then
            nm -D "$SOURCE" | grep "$SYMBOL" > /tmp/symbol.log || CODE=2
          fi
          if [ "$CODE" -eq 0 ]; then
            OUT=src/main/resources/natives/antikytheramechanism_sable_rapier/sable_rapier_x86_64_linux.so
            cp "$SOURCE" "$OUT"
            SHA=$(sha256sum "$OUT" | awk '{print $1}')
            SIZE=$(stat -c '%s' "$OUT")
            file "$OUT" > /tmp/file.log
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write build report
        if: always()
        shell: bash
        run: |
          {
            echo '# Fast Sable 2.0.5 Linux native build'
            echo
            echo "source commit: 6966d2928340de7631abcecf8549904b877df0a8"
            echo "clone exit: ${{ steps.source.outputs.clone }}"
            echo "checkout exit: ${{ steps.source.outputs.checkout }}"
            echo "patch exit: ${{ steps.source.outputs.patch }}"
            echo "zigbuild image exit: ${{ steps.image.outputs.code }}"
            echo "compile exit: ${{ steps.compile.outputs.code }}"
            echo "verify exit: ${{ steps.verify.outputs.code }}"
            echo "sha256: ${{ steps.verify.outputs.sha }}"
            echo "size: ${{ steps.verify.outputs.size }}"
            for F in /tmp/source.log /tmp/image.log /tmp/compile.log /tmp/symbol.log /tmp/file.log; do
              echo; echo "## $F"; echo '```text'
              if [ -f "$F" ]; then tail -n 160 "$F"; else echo '(not produced)'; fi
              echo '```'
            done
          } > SABLE_2_0_5_LINUX_FAST_BUILD.md

      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- SABLE_2_0_5_LINUX_FAST_BUILD.md
          if [ -f src/main/resources/natives/antikytheramechanism_sable_rapier/sable_rapier_x86_64_linux.so ]; then
            git add -- src/main/resources/natives/antikytheramechanism_sable_rapier/sable_rapier_x86_64_linux.so
          fi
          git commit -m 'Build patched Sable 2.0.5 Linux native' || true
          git push origin HEAD:agent/validate-sable-2.0.5-stack-1.3.1

      - name: Require native
        if: always()
        shell: bash
        run: test "${{ steps.verify.outputs.code }}" = '0'
