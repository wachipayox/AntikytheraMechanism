name: Runtime Validation

on:
  push:
    branches:
      - 'agent/validate-direct-air-prefix'

permissions:
  contents: write

jobs:
  core:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe
          set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false --console=plain > probe/prefix-core.log 2>&1
          echo "$?" > probe/prefix-core.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: prefix-core-${{ github.sha }}, path: 'probe/*', if-no-files-found: error}
  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/validate-direct-air-prefix}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: 'prefix-core-${{ github.sha }}', path: ci-prefix-stack, merge-multiple: true}
      - shell: bash
        run: |
          mkdir -p ci-prefix-stack
          echo "validated_sha=${GITHUB_SHA}" > ci-prefix-stack/summary.txt
          for f in ci-prefix-stack/*.status; do echo "$(basename "$f" .status)=$(cat "$f")" >> ci-prefix-stack/summary.txt; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/validate-direct-air-prefix
          git add ci-prefix-stack
          git diff --cached --quiet && exit 0
          git commit -m "Record direct-air pre-fix stack"
          git push origin HEAD:agent/validate-direct-air-prefix
