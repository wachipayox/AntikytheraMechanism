name: Apply direct vacated-source patch

on:
  push:
    branches:
      - 'agent/fix-create-vacated-frame-reuse-v2'

permissions:
  contents: write

jobs:
  patch:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-create-vacated-frame-reuse-v2
          fetch-depth: 0
      - name: Apply direct manager implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manager_path = Path('src/main/java/dev/antikytheramechanism/assembly/MechanismAssemblyManager.java')
          text = manager_path.read_text()

          old = '''    public boolean isContraptionLifecycleTransition(BlockPos framePosition) {
              return pendingContraptionMoves.values().stream().anyMatch(move -> move.covers(framePosition));
          }
          '''
          new = '''    /**
           * Releases live ownership of a Create source only after the Frame physically vacates it.
           * The persisted contraption journal keeps the historical source for recovery.
           */
          public boolean releaseContraptionSource(BlockPos sourcePosition) {
              BlockPos source = sourcePosition.immutable();
              UUID owner = frameIndex.get(source);
              if (owner == null) {
                  return false;
              }
              PendingContraptionMove move = pendingContraptionMoves.get(owner);
              if (move == null
                      || move.hasPlacement()
                      || !move.sourceFrames().contains(source)
                      || move.isSourceReleased(source)) {
                  return false;
              }
              pendingContraptionMoves.put(owner, move.withReleasedSource(source));
              frameIndex.remove(source, owner);
              setDirty();
              return true;
          }

          public boolean isContraptionLifecycleTransition(BlockPos framePosition) {
              return pendingContraptionMoves.values().stream().anyMatch(move ->
                      move.targetFrames().contains(framePosition)
                              || (move.sourceFrames().contains(framePosition)
                                      && !move.isSourceReleased(framePosition)));
          }
          '''
          if old not in text:
              raise SystemExit('transition anchor missing')
          text = text.replace(old, new, 1)

          old = '''            for (BlockPos source : move.sourceFrames()) {
                  if (!assembly.id().equals(frameIndex.get(source))) {
                      return false;
                  }
                  BlockPos logical = assembly.logicalFrameOffset(source);
          '''
          new = '''            for (BlockPos source : move.sourceFrames()) {
                  if (!move.isSourceReleased(source)
                          && !assembly.id().equals(frameIndex.get(source))) {
                      return false;
                  }
                  BlockPos logical = assembly.logicalFrameOffset(source);
          '''
          if old not in text:
              raise SystemExit('finalize source validation anchor missing')
          text = text.replace(old, new, 1)

          old = '''                assembly.relocate(snapshot.origin(), snapshot.frames(), snapshot.orientation());
                  assembly.setPoseTarget(snapshot.pose());
                  snapshot.frames().forEach(frame -> frameIndex.put(frame, assembly.id()));
              }
          '''
          new = '''                assembly.relocate(snapshot.origin(), snapshot.frames(), snapshot.orientation());
                  assembly.setPoseTarget(snapshot.pose());
                  PendingContraptionMove move = pendingContraptionMoves.get(entry.getKey());
                  snapshot.frames().forEach(frame -> {
                      if (move == null || !move.isSourceReleased(frame)) {
                          frameIndex.put(frame, assembly.id());
                      }
                  });
              }
          '''
          if old not in text:
              raise SystemExit('finalize rollback anchor missing')
          text = text.replace(old, new, 1)

          old = '''            if (!move.hasPlacement()
                      && allLoaded(level, move.sourceFrames())
          '''
          new = '''            if (!move.hasPlacement()
                      && move.releasedSourceFrames().isEmpty()
                      && allLoaded(level, move.sourceFrames())
          '''
          if old not in text:
              raise SystemExit('reconcile unstarted anchor missing')
          text = text.replace(old, new, 1)

          start = text.index('    private static MechanismAssemblyManager load(CompoundTag tag, HolderLookup.Provider registries) {')
          end = text.rfind('\n}')
          if end <= start:
              raise SystemExit('load boundary missing')
          replacement = '''    private static MechanismAssemblyManager load(CompoundTag tag, HolderLookup.Provider registries) {
              MechanismAssemblyManager manager = new MechanismAssemblyManager();
              boolean repairedCorruption = false;
              ListTag list = tag.getList(ASSEMBLIES_TAG, Tag.TAG_COMPOUND);
              for (int index = 0; index < list.size(); index++) {
                  MechanismAssembly assembly;
                  try {
                      assembly = MechanismAssembly.load(list.getCompound(index));
                  } catch (RuntimeException exception) {
                      AntikytheraMechanism.LOGGER.error(
                              "Could not decode an assembly SavedData entry; leaving it untouched in the world for manual recovery",
                              exception);
                      repairedCorruption = true;
                      continue;
                  }
                  if (manager.assemblies.putIfAbsent(assembly.id(), assembly) != null) {
                      manager.contentRecoveryLocks.add(assembly.id());
                      repairedCorruption = true;
                      AntikytheraMechanism.LOGGER.error(
                              "Duplicate assembly UUID {} in SavedData; retained the first record and locked it",
                              assembly.id());
                      continue;
                  }
                  if (assembly.frames().isEmpty()) {
                      manager.contentRecoveryLocks.add(assembly.id());
                      repairedCorruption = true;
                      AntikytheraMechanism.LOGGER.error(
                              "Assembly {} has no parent frames; retained and locked its physical content reference",
                              assembly.id());
                  }
              }

              ListTag pendingList = tag.getList(PENDING_PISTON_MOVES_TAG, Tag.TAG_COMPOUND);
              for (int index = 0; index < pendingList.size(); index++) {
                  try {
                      PendingPistonMove move = PendingPistonMove.load(pendingList.getCompound(index));
                      manager.pendingPistonMoves.put(move.assemblyId(), move);
                  } catch (IllegalArgumentException exception) {
                      AntikytheraMechanism.LOGGER.error("Discarded an invalid persisted piston journal", exception);
                  }
              }

              // Decode Create journals before rebuilding active ownership. Released sources are
              // historical members of the moving assembly, not current frameIndex claims.
              ListTag pendingContraptions = tag.getList(PENDING_CONTRAPTION_MOVES_TAG, Tag.TAG_COMPOUND);
              for (int index = 0; index < pendingContraptions.size(); index++) {
                  CompoundTag persisted = pendingContraptions.getCompound(index).copy();
                  try {
                      PendingContraptionMove move = PendingContraptionMove.load(persisted, registries);
                      manager.pendingContraptionMoves.put(move.assemblyId(), move);
                  } catch (RuntimeException exception) {
                      manager.undecodedContraptionJournals.add(persisted);
                      if (persisted.hasUUID(ASSEMBLY_ID_TAG)) {
                          manager.contentRecoveryLocks.add(persisted.getUUID(ASSEMBLY_ID_TAG));
                      }
                      AntikytheraMechanism.LOGGER.error(
                              "Could not decode a persisted Create contraption journal; its raw NBT was retained and its assembly locked",
                              exception);
                  }
              }

              List<UUID> indexedAssemblyIds = new ArrayList<>(manager.assemblies.keySet());
              indexedAssemblyIds.sort(UUID::compareTo);
              for (UUID assemblyId : indexedAssemblyIds) {
                  MechanismAssembly assembly = manager.assemblies.get(assemblyId);
                  PendingContraptionMove move = manager.pendingContraptionMoves.get(assemblyId);
                  boolean trustedReleasedSources = move != null && assembly.frames().equals(move.sourceFrames());
                  for (BlockPos frame : assembly.frames()) {
                      if (trustedReleasedSources && move.isSourceReleased(frame)) {
                          continue;
                      }
                      UUID previous = manager.frameIndex.putIfAbsent(frame, assembly.id());
                      if (previous != null && !previous.equals(assembly.id())) {
                          manager.contentRecoveryLocks.add(previous);
                          manager.contentRecoveryLocks.add(assembly.id());
                          repairedCorruption = true;
                          AntikytheraMechanism.LOGGER.error(
                                  "Frame {} is claimed by assemblies {} and {}; both were locked and neither physical content world was removed",
                                  frame,
                                  previous,
                                  assembly.id());
                      }
                  }
              }

              ListTag pendingEvacuations = tag.getList(PENDING_FRAME_EVACUATIONS_TAG, Tag.TAG_COMPOUND);
              for (int index = 0; index < pendingEvacuations.size(); index++) {
                  CompoundTag persisted = pendingEvacuations.getCompound(index).copy();
                  try {
                      PendingFrameEvacuation journal = PendingFrameEvacuation.load(persisted, registries);
                      PendingFrameEvacuation previous = manager.pendingFrameEvacuations.putIfAbsent(journal.assemblyId(), journal);
                      manager.contentRecoveryLocks.add(journal.assemblyId());
                      if (previous != null) {
                          manager.undecodedFrameEvacuationJournals.add(persisted);
                          AntikytheraMechanism.LOGGER.error(
                                  "Assembly {} has more than one persisted frame evacuation journal; all records were retained and the assembly remains locked",
                                  journal.assemblyId());
                      }
                  } catch (RuntimeException exception) {
                      manager.undecodedFrameEvacuationJournals.add(persisted);
                      if (persisted.hasUUID(ASSEMBLY_ID_TAG)) {
                          manager.contentRecoveryLocks.add(persisted.getUUID(ASSEMBLY_ID_TAG));
                      }
                      AntikytheraMechanism.LOGGER.error(
                              "Could not decode a persisted frame evacuation journal; its raw NBT was retained",
                              exception);
                  }
              }
              ListTag recoveryLocks = tag.getList(CONTENT_RECOVERY_LOCKS_TAG, Tag.TAG_COMPOUND);
              for (int index = 0; index < recoveryLocks.size(); index++) {
                  CompoundTag lock = recoveryLocks.getCompound(index);
                  if (lock.hasUUID(ASSEMBLY_ID_TAG)) {
                      manager.contentRecoveryLocks.add(lock.getUUID(ASSEMBLY_ID_TAG));
                  }
              }
              if (repairedCorruption) {
                  manager.setDirty();
              }
              return manager;
          }
          '''
          manager_path.write_text(text[:start] + replacement + text[end:])

          frame_path = Path('src/main/java/dev/antikytheramechanism/frame/MechanismFrameBlock.java')
          frame = frame_path.read_text()
          old = '''            MechanismAssemblyManager manager = MechanismAssemblyManager.get(serverLevel);
                  boolean relocation = manager.isPhysicalRelocationTransition(pos);
          '''
          new = '''            MechanismAssemblyManager manager = MechanismAssemblyManager.get(serverLevel);
                  boolean releasedContraptionSource = manager.releaseContraptionSource(pos);
                  boolean relocation = releasedContraptionSource || manager.isPhysicalRelocationTransition(pos);
          '''
          if old not in frame:
              raise SystemExit('frame onRemove anchor missing')
          frame_path.write_text(frame.replace(old, new, 1))
          PY

          git config user.name "Antikythera CI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/antikytheramechanism/assembly/MechanismAssemblyManager.java src/main/java/dev/antikytheramechanism/frame/MechanismFrameBlock.java
          git diff --cached --check
          git commit -m "Implement direct Create source release semantics"
          git push origin HEAD:agent/fix-create-vacated-frame-reuse-v2
