name: Runtime Validation

on:
  push:
    branches:
      - 'agent/create-frame-rotation-regression-apply'

jobs:
  gametest:
    strategy:
      fail-fast: false
      matrix:
        create: ['true', 'false']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer -Pinclude_create=${{ matrix.create }} -Pinclude_simulated=false --console=plain 2>&1 | tee /tmp/gametest.log
      - name: Scan GameTest log
        if: always()
        shell: bash
        run: |
          if grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading' /tmp/gametest.log \
            | grep -v 'org/jetbrains/annotations/ApiStatus\$ScheduledForRemoval'; then
            exit 1
          fi
      - name: Upload failed GameTest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log-create-${{ matrix.create }}
          path: /tmp/gametest.log
          if-no-files-found: error

  server:
    strategy:
      fail-fast: false
      matrix:
        create: ['true', 'false']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start dedicated server and wait for world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout --signal=TERM 150s ./gradlew --no-daemon runServer -Pinclude_create=${{ matrix.create }} -Pinclude_simulated=false --console=plain > /tmp/server.log 2>&1
          rc=$?
          set -e
          cat /tmp/server.log
          grep -E 'Done \([0-9.]+s\)!|Done \(' /tmp/server.log
          ! grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading' /tmp/server.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then exit "$rc"; fi

  client:
    strategy:
      fail-fast: false
      matrix:
        create: ['true', 'false']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start real client under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 150s xvfb-run -a ./gradlew --no-daemon runClient -Pinclude_create=${{ matrix.create }} -Pinclude_simulated=false --console=plain > /tmp/client.log 2>&1
          rc=$?
          set -e
          cat /tmp/client.log
          grep -E 'OpenAL initialized|Created: [0-9]+x[0-9]+x[0-9]+ minecraft:textures/atlas|Reloading ResourceManager' /tmp/client.log
          ! grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading' /tmp/client.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then exit "$rc"; fi
