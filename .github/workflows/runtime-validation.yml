name: Runtime Validation

on:
  push:
    branches:
      - 'agent/validate-sable-frame-lifecycle-regressions'

permissions:
  contents: write

concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe
          set +e
          ./gradlew --no-daemon build --console=plain > probe/build.log 2>&1
          echo "$?" > probe/build.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-build-${{ github.sha }}
          path: probe/*
          if-no-files-found: error

  gametest:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {create: 'false', simulated: 'false', label: core-1}
          - {create: 'false', simulated: 'false', label: core-2}
          - {create: 'false', simulated: 'false', label: core-3}
          - {create: 'true', simulated: 'false', label: create}
          - {create: 'true', simulated: 'true', label: simulated-1}
          - {create: 'true', simulated: 'true', label: simulated-2}
          - {create: 'true', simulated: 'true', label: simulated-3}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests
        shell: bash
        run: |
          mkdir -p probe
          set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=${{ matrix.create }} -Pinclude_simulated=${{ matrix.simulated }} --console=plain > probe/${{ matrix.label }}.log 2>&1
          echo "$?" > probe/${{ matrix.label }}.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-${{ matrix.label }}-${{ github.sha }}
          path: probe/*
          if-no-files-found: error

  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [build, gametest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-sable-frame-lifecycle-regressions
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lifecycle-*-${{ github.sha }}
          path: ci-validation
          merge-multiple: true
      - shell: bash
        run: |
          mkdir -p ci-validation
          {
            echo "validated_sha=${GITHUB_SHA}"
            for f in ci-validation/*.status; do
              echo "$(basename "$f" .status)=$(cat "$f")"
            done
          } > ci-validation/summary.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/validate-sable-frame-lifecycle-regressions
          git add ci-validation
          git diff --cached --quiet && exit 0
          git commit -m "Record exhaustive lifecycle validation"
          git push origin HEAD:agent/validate-sable-frame-lifecycle-regressions
