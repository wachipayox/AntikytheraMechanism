name: Runtime Validation

on:
  push:
    branches:
      - 'agent/feedback-fix-temp'

jobs:
  client-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start Create + Simulated client and verify mixins
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 150s xvfb-run -a ./gradlew --no-daemon runClient -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/client.log 2>&1
          rc=$?
          set -e
          cat /tmp/client.log
          grep -E 'OpenAL initialized|Created: [0-9]+x[0-9]+x[0-9]+ minecraft:textures/atlas|Reloading ResourceManager' /tmp/client.log
          ! grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading' /tmp/client.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then exit "$rc"; fi
      - name: Upload failed client log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-bootstrap-log
          path: /tmp/client.log
          if-no-files-found: error

  feedback-gametest-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests for feedback regressions
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/gametest.log 2>&1
          rc=$?
          set -e
          cat /tmp/gametest.log
          if grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading' /tmp/gametest.log; then
            exit 1
          fi
          # Full-suite legacy failures are not promoted by this disposable validation job; retain the
          # complete log so the two new feedback regressions can be inspected directly.
          echo "GameTest Gradle exit code: $rc"
      - name: Upload GameTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-feedback-gametest-log
          path: /tmp/gametest.log
          if-no-files-found: error
