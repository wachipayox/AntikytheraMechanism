name: Runtime Validation

on:
  push:
    branches:
      - 'agent/validate-host-write-diag'

permissions:
  contents: write

concurrency:
  group: host-write-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe
          set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false --console=plain > probe/core-${{ matrix.run }}.log 2>&1
          echo "$?" > probe/core-${{ matrix.run }}.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-write-${{ matrix.run }}-${{ github.sha }}
          path: probe/*
          if-no-files-found: error

  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [gametest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-host-write-diag
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'host-write-*-${{ github.sha }}'
          path: ci-host-write
          merge-multiple: true
      - shell: bash
        run: |
          mkdir -p ci-host-write
          echo "validated_sha=${GITHUB_SHA}" > ci-host-write/summary.txt
          for f in ci-host-write/*.status; do echo "$(basename "$f" .status)=$(cat "$f")" >> ci-host-write/summary.txt; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/validate-host-write-diag
          git add ci-host-write
          git diff --cached --quiet && exit 0
          git commit -m "Record foreign-host write diagnostics"
          git push origin HEAD:agent/validate-host-write-diag
