name: Frame Presentation Stability Probe

on:
  push:
    branches:
      - agent/frame-shell-modes-and-skins
    paths:
      - .github/workflows/frame-presentation-stability-probe.yml

permissions:
  contents: write

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Mask original GameTests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          presentation_files = {
              'MechanismFramePresentationGameTests.java',
              'CreateFramePresentationGameTests.java',
              'MechanismFramePresentationLifecycleGameTests.java',
              'SableFramePresentationRelocationGameTests.java',
              'CreateFramePresentationContraptionGameTests.java',
          }
          kept = 0
          for path in Path('src/main/java').rglob('*.java'):
              keep = path.name in presentation_files
              lines = []
              for line in path.read_text(encoding='utf-8').splitlines(True):
                  if re.match(r'^\s*@GameTest(?:\(|\s|$)', line):
                      if keep:
                          kept += 1
                      else:
                          indent = line[:len(line)-len(line.lstrip())]
                          line = indent + '// ' + line[len(indent):]
                  lines.append(line)
              path.write_text(''.join(lines), encoding='utf-8')
          if kept != 13:
              raise SystemExit(f'expected 13 presentation tests, found {kept}')
          PY
      - name: Run presentation suite
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 600s ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/presentation.log 2>&1
          status=$?
          set -e
          {
            echo "kind=presentation"
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|failed!|bearingroundtrip|rootforeignroot|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by|FREEZE DUMP' /tmp/presentation.log | tail -n 320 || true
            echo '--- tail ---'
            tail -n 220 /tmp/presentation.log || true
          } > stability-presentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-presentation
          path: stability-presentation.txt

  original-ab:
    strategy:
      fail-fast: false
      matrix:
        refkind: [base, current]
        repeat: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.refkind == 'base' && '044c1d57401b3c95a3193d8540f5ec7a97635787' || 'agent/frame-shell-modes-and-skins' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Mask presentation GameTests on current branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          presentation_files = {
              'MechanismFramePresentationGameTests.java',
              'CreateFramePresentationGameTests.java',
              'MechanismFramePresentationLifecycleGameTests.java',
              'SableFramePresentationRelocationGameTests.java',
              'CreateFramePresentationContraptionGameTests.java',
          }
          for path in Path('src/main/java').rglob('*.java'):
              if path.name not in presentation_files:
                  continue
              lines=[]
              for line in path.read_text(encoding='utf-8').splitlines(True):
                  if re.match(r'^\s*@GameTest(?:\(|\s|$)', line):
                      indent=line[:len(line)-len(line.lstrip())]
                      line=indent+'// '+line[len(indent):]
                  lines.append(line)
              path.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Run original suite
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 600s ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/original.log 2>&1
          status=$?
          set -e
          {
            echo "kind=original"
            echo "refkind=${{ matrix.refkind }}"
            echo "repeat=${{ matrix.repeat }}"
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|failed!|diagonalseparateframesinsameforeignhostusenativecogratio|source Frame did not return to ROOT|could not create common foreign Sable host|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by|FREEZE DUMP' /tmp/original.log | tail -n 320 || true
            echo '--- tail ---'
            tail -n 180 /tmp/original.log || true
          } > stability-${{ matrix.refkind }}-${{ matrix.repeat }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-${{ matrix.refkind }}-${{ matrix.repeat }}
          path: stability-${{ matrix.refkind }}-${{ matrix.repeat }}.txt

  collect:
    if: always()
    needs: [presentation, original-ab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: stability-*
          merge-multiple: true
          path: /tmp/results
      - name: Record probe and clean harness
        shell: bash
        run: |
          mkdir -p .validation
          {
            for f in /tmp/results/stability-*.txt; do
              echo "===== $(basename "$f") ====="
              cat "$f"
              echo
            done
          } > .validation/frame-presentation-stability-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frame-presentation-stability-probe.yml
          git add .validation/frame-presentation-stability-probe.txt
          git commit -m "Record frame presentation stability probe"
          git push origin HEAD:agent/frame-shell-modes-and-skins
