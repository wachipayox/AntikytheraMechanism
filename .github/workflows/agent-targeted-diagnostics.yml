name: Agent Targeted Lifecycle Diagnostics
on:
  push:
    branches: ['agent/fix-sable-frame-lifecycle-regressions']
permissions:
  contents: write
jobs:
  gametest:
    if: github.event.head_commit.message == 'Run post-A diagnostics'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: core, create: 'false', simulated: 'false'}
          - {label: create, create: 'true', simulated: 'false'}
          - {label: simulated-1, create: 'true', simulated: 'true'}
          - {label: simulated-2, create: 'true', simulated: 'true'}
          - {label: simulated-3, create: 'true', simulated: 'true'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe
          set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=${{ matrix.create }} -Pinclude_simulated=${{ matrix.simulated }} --console=plain > probe/${{ matrix.label }}.log 2>&1
          echo "$?" > probe/${{ matrix.label }}.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: post-a-${{ matrix.label }}-${{ github.sha }}, path: 'probe/*', if-no-files-found: error}
  publish:
    if: always() && github.event.head_commit.message == 'Run post-A diagnostics'
    needs: [gametest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/fix-sable-frame-lifecycle-regressions}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: 'post-a-*-${{ github.sha }}', path: ci-post-a, merge-multiple: true}
      - shell: bash
        run: |
          mkdir -p ci-post-a
          { echo "trigger_sha=${GITHUB_SHA}"; for f in ci-post-a/*.status; do echo "$(basename "$f" .status)=$(cat "$f")"; done; } > ci-post-a/summary.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/fix-sable-frame-lifecycle-regressions
          git add ci-post-a
          git diff --cached --quiet && exit 0
          git commit -m "Record post-A lifecycle diagnostics"
          git push origin HEAD:agent/fix-sable-frame-lifecycle-regressions
