name: Agent Targeted Lifecycle Diagnostics
on:
  push:
    branches: ['agent/fix-sable-frame-lifecycle-regressions']
    paths: ['.agent-targeted-diagnostics-trigger']
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: a6603cb4ddad7e12769ce779e13d0bf97f66b238}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe; set +e
          timeout --signal=TERM 15m ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false --console=plain > probe/prefix-core.log 2>&1
          echo "$?" > probe/prefix-core.status; exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: targeted-core-${{ github.sha }}, path: 'probe/*', if-no-files-found: warn}
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: a6603cb4ddad7e12769ce779e13d0bf97f66b238}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe; set +e
          timeout --signal=TERM 15m ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=false --console=plain > probe/prefix-create.log 2>&1
          echo "$?" > probe/prefix-create.status; exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: targeted-create-${{ github.sha }}, path: 'probe/*', if-no-files-found: warn}
  simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: a6603cb4ddad7e12769ce779e13d0bf97f66b238}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe; set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > probe/prefix-simulated.log 2>&1
          echo "$?" > probe/prefix-simulated.status; exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: targeted-simulated-${{ github.sha }}, path: 'probe/*', if-no-files-found: warn}
  publish:
    if: always()
    needs: [core, create, simulated]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/fix-sable-frame-lifecycle-regressions}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: 'targeted-*-${{ github.sha }}', path: ci-targeted-diagnostics, merge-multiple: true}
      - shell: bash
        run: |
          mkdir -p ci-targeted-diagnostics
          { echo "trigger_sha=${GITHUB_SHA}"; echo "tested_sha=a6603cb4ddad7e12769ce779e13d0bf97f66b238"; for f in ci-targeted-diagnostics/*.status; do echo "$(basename "$f" .status)=$(cat "$f")"; done; } > ci-targeted-diagnostics/summary.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/fix-sable-frame-lifecycle-regressions
          git add ci-targeted-diagnostics
          git diff --cached --quiet && exit 0
          git commit -m "Record targeted pre-fix lifecycle diagnostics"
          git push origin HEAD:agent/fix-sable-frame-lifecycle-regressions
