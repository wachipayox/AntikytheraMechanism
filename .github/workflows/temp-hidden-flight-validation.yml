name: TEMP Hidden Flight Geometry Validation

on:
  push:
    branches:
      - 'agent/tmp-hidden-flight-validation'

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - simulated: 'false'
            label: create
          - simulated: 'true'
            label: simulated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add isolated GameTest run locally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          text = p.read_text()
          needle = '''        gameTestServer {\n            type = "gameTestServer"\n            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id\n        }\n'''
          extra = needle + '''        hiddenGeometryGameTestServer {\n            type = "gameTestServer"\n            systemProperty 'neoforge.enabledGameTestNamespaces', 'antikytheramechanism_hidden_geometry_validation'\n        }\n'''
          if needle not in text:
              raise SystemExit('gameTestServer run block not found')
          p.write_text(text.replace(needle, extra, 1))
          PY
      - name: Run focused hidden geometry GameTest
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 360s ./gradlew --no-daemon runHiddenGeometryGameTestServer -Pinclude_create=true -Pinclude_simulated=${{ matrix.simulated }} --console=plain 2>&1 | tee validation.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish focused status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.focused.outputs.code }}
          LABEL: ${{ matrix.label }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CODE" = "0" ]; then
            state=success
            description='Focused hidden-flight geometry GameTest passed'
          else
            state=failure
            description="Focused hidden-flight geometry GameTest failed (exit $CODE)"
          fi
          python - <<'PY'
          import json, os
          json.dump({
              'state': os.environ['STATE'],
              'context': 'hidden-flight-geometry/' + os.environ['LABEL'],
              'description': os.environ['DESCRIPTION'],
              'target_url': os.environ['RUN_URL'],
          }, open('status.json', 'w'))
          PY
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @status.json
          if [ "$CODE" != "0" ]; then exit "$CODE"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.focused.outputs.code }}
          LABEL: ${{ matrix.label }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ steps.focused.outputs.code == '0' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.focused.outputs.code == '0' && 'Focused hidden-flight geometry GameTest passed' || 'Focused hidden-flight geometry GameTest failed' }}
      - name: Upload failed evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-flight-geometry-${{ matrix.label }}
          path: validation.log
          if-no-files-found: error
