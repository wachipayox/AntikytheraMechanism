name: Agent Apply Nested Regressions

on:
  push:
    branches: ['agent/create-frame-rotation-fix']

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode and apply reviewed patch
        run: |
          cat .agent/reg-v4.part00 .agent/reg-v4.part01 .agent/reg-v4.part02 | base64 -d > /tmp/regression-fixes.patch.gz
          echo 'eab8be857ac435034b34a989a4eff1328da5b27e558a0fa4f9eb907862d7938e  /tmp/regression-fixes.patch.gz' | sha256sum -c -
          gzip -dc /tmp/regression-fixes.patch.gz > /tmp/regression-fixes.patch
          git apply --check /tmp/regression-fixes.patch
          git apply /tmp/regression-fixes.patch
          git diff --check
      - name: Clean build and unit tests
        run: ./gradlew --no-daemon clean build
      - name: Commit regression fixes
        run: |
          rm -rf .agent
          rm -f .github/workflows/agent-apply-regressions.yml .github/workflows/agent-export-current.yml
          git config user.name 'Wachii'
          git config user.email 'dani.alvarado.sosa@gmail.com'
          git add -A
          git commit -m 'Fix nested contraption frame regressions'
          git push origin HEAD:agent/create-frame-rotation-fix
