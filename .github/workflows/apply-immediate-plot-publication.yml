name: Apply Immediate Plot Publication

on:
  push:
    branches:
      - 'agent/fix-runtime-gametests'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-gametests
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply production publication fix and remove staging delays
        shell: bash
        run: |
          cat > src/main/java/dev/antikytheramechanism/mixin/ChunkMapAccessor.java <<'JAVA'
          package dev.antikytheramechanism.mixin;

          import net.minecraft.server.level.ChunkMap;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Invoker;

          @Mixin(ChunkMap.class)
          public interface ChunkMapAccessor {
              @Invoker("promoteChunkMap")
              void antikytheramechanism$promoteChunkMap();
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/resources/antikytheramechanism.mixins.json')
          text = p.read_text()
          if '"ChunkMapAccessor"' not in text:
              text = text.replace('"ClipContextAccessor",', '"ClipContextAccessor","ChunkMapAccessor",', 1)
          if '"ChunkMapAccessor"' not in text:
              raise SystemExit('could not register ChunkMapAccessor')
          p.write_text(text)

          p = Path('src/main/java/dev/antikytheramechanism/sublevel/MechanismSubLevelService.java')
          text = p.read_text()
          if 'import dev.antikytheramechanism.mixin.ChunkMapAccessor;' not in text:
              anchor = 'import dev.antikytheramechanism.assembly.MechanismAssemblyManager;\n'
              if anchor not in text:
                  raise SystemExit('MechanismSubLevelService import anchor missing')
              text = text.replace(anchor, anchor + 'import dev.antikytheramechanism.mixin.ChunkMapAccessor;\n', 1)
          anchor = '        LevelPlot plot = subLevel.getPlot();\n        plot.newEmptyChunk(plot.getCenterChunk());\n'
          if 'antikytheramechanism$promoteChunkMap' not in text:
              if anchor not in text:
                  raise SystemExit('createForContent publication anchor missing')
              replacement = '''        LevelPlot plot = subLevel.getPlot();
          plot.newEmptyChunk(plot.getCenterChunk());
          // Sable inserts a fresh plot holder into ChunkMap.updatingChunkMap and marks the map dirty.
          // The normal visible-map promotion happens later in the server tick, but first mini placement
          // addresses this child synchronously. Publish the holder now so ServerLevel reads/writes cannot
          // fall through to the vanilla chunk that previously occupied the reserved plot coordinate.
          ((ChunkMapAccessor) (Object) level.getChunkSource().chunkMap).antikytheramechanism$promoteChunkMap();
          '''
              text = text.replace(anchor, replacement, 1)
          p.write_text(text)

          staging = (
              "        // Allow Sable's newly registered plot holder to become visible through ServerLevel\n"
              "        // before authoritative fixture writes address the managed child.\n"
              "        helper.runAfterDelay(2, () -> {\n\n"
          )
          files = {
              'src/main/java/dev/antikytheramechanism/assembly/CreateBoundaryLampFrameOrientationGameTests.java': 2,
              'src/main/java/dev/antikytheramechanism/assembly/RotatedDockLampStateGameTests.java': 1,
              'src/main/java/dev/antikytheramechanism/sublevel/SableRelocationGameTests.java': 2,
          }
          for path, expected in files.items():
              p = Path(path)
              text = p.read_text()
              if text.count(staging) != expected:
                  raise SystemExit(f'{path}: expected {expected} staging wrappers, found {text.count(staging)}')
              text = text.replace(staging, '')
              if path.endswith('CreateBoundaryLampFrameOrientationGameTests.java'):
                  a = '            helper.succeed();\n        });\n        });\n    }\n\n    private static void exerciseRotatedStop'
                  b = '            helper.succeed();\n        });\n    }\n\n    private static void exerciseRotatedStop'
                  c = '            });\n        });\n        });\n    }\n\n    private static ServerSubLevel requireChild'
                  d = '            });\n        });\n    }\n\n    private static ServerSubLevel requireChild'
                  if a not in text or c not in text:
                      raise SystemExit('CreateBoundary staging close anchors missing')
                  text = text.replace(a, b, 1).replace(c, d, 1)
              elif path.endswith('RotatedDockLampStateGameTests.java'):
                  a = '            helper.succeed();\n        });\n        });\n    }\n\n    private static void seedManagedMiniLamp'
                  b = '            helper.succeed();\n        });\n    }\n\n    private static void seedManagedMiniLamp'
                  if a not in text:
                      raise SystemExit('RotatedDock staging close anchor missing')
                  text = text.replace(a, b, 1)
              else:
                  a = '        helper.succeed();\n        });\n    }\n\n    @GameTest(template = "frame_rotation_empty", timeoutTicks = 200)\n    public static void miniBackedMacroAttachmentSurvivesSableAssemblyAndDisassembly'
                  b = '        helper.succeed();\n    }\n\n    @GameTest(template = "frame_rotation_empty", timeoutTicks = 200)\n    public static void miniBackedMacroAttachmentSurvivesSableAssemblyAndDisassembly'
                  c = '        helper.succeed();\n        });\n    }\n\n    @GameTest(template = "frame_rotation_empty", timeoutTicks = 200)\n    public static void populatedFrameRoundTripThroughSableMoveBlocks'
                  d = '        helper.succeed();\n    }\n\n    @GameTest(template = "frame_rotation_empty", timeoutTicks = 200)\n    public static void populatedFrameRoundTripThroughSableMoveBlocks'
                  if a not in text or c not in text:
                      raise SystemExit('SableRelocation staging close anchors missing')
                  text = text.replace(a, b, 1).replace(c, d, 1)
              p.write_text(text)
          PY
      - name: Compile publication fix
        run: ./gradlew --no-daemon compileJava --console=plain
      - name: Commit publication fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/dev/antikytheramechanism/mixin/ChunkMapAccessor.java \
                  src/main/java/dev/antikytheramechanism/sublevel/MechanismSubLevelService.java \
                  src/main/resources/antikytheramechanism.mixins.json \
                  src/main/java/dev/antikytheramechanism/assembly/CreateBoundaryLampFrameOrientationGameTests.java \
                  src/main/java/dev/antikytheramechanism/assembly/RotatedDockLampStateGameTests.java \
                  src/main/java/dev/antikytheramechanism/sublevel/SableRelocationGameTests.java
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m 'Publish managed plot chunks before first mini access'
          git push origin HEAD:agent/fix-runtime-gametests
