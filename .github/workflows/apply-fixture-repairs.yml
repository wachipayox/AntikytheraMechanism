name: Apply Runtime Support Repairs

on:
  push:
    branches:
      - 'agent/fix-runtime-gametests'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage runtime support repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-gametests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply and compile runtime support fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          p = Path('src/main/java/dev/antikytheramechanism/sublevel/SableAssemblyMoveContext.java')
          t = p.read_text()
          t = once(t,
              '        Map<BlockPos, BlockPos> sourcesByTarget = new HashMap<>();\n',
              '        Map<BlockPos, BlockPos> sourcesByTarget = new HashMap<>();\n        Map<BlockPos, BlockState> sourceStates = new HashMap<>();\n',
              'source state map')
          t = once(t,
              '            sourcesByTarget.put(target, immutableSource);\n',
              '            sourcesByTarget.put(target, immutableSource);\n            sourceStates.put(immutableSource, sourceLevel.getBlockState(immutableSource));\n',
              'source state capture')
          t = once(t,
              '                Collections.unmodifiableMap(sourcesByTarget));\n',
              '                Collections.unmodifiableMap(sourcesByTarget),\n                Collections.unmodifiableMap(sourceStates));\n',
              'context construction')
          marker = '    /** Source positions selected by Sable for the current complete move. */\n'
          helper = '''    /**
     * Returns the pre-move state for a selected block at either endpoint of the active Sable move.
     * The snapshot exists only while moveBlocks is on the stack, so it cannot become a permanent
     * virtual shell after assembly or disassembly completes.
     */
    public static @Nullable BlockState frozenMovedBlockState(ServerLevel level, BlockPos position) {
        for (Context context : STACK.get()) {
            BlockPos source = null;
            if (context.sourceLevel == level && context.sourceBlocks.contains(position)) {
                source = position;
            } else if (context.targetLevel == level) {
                source = context.sourcesByTarget.get(position);
            }
            if (source != null) {
                return context.sourceStates.get(source);
            }
        }
        return null;
    }

'''
          t = once(t, marker, helper + marker, 'public frozen-state helper')
          t = once(t,
              '        private final Map<BlockPos, BlockPos> sourcesByTarget;\n',
              '        private final Map<BlockPos, BlockPos> sourcesByTarget;\n        private final Map<BlockPos, BlockState> sourceStates;\n',
              'context source state field')
          t = once(t,
              '                Map<BlockPos, BlockPos> sourcesByTarget) {\n',
              '                Map<BlockPos, BlockPos> sourcesByTarget,\n                Map<BlockPos, BlockState> sourceStates) {\n',
              'context source state parameter')
          t = once(t,
              '            this.sourcesByTarget = sourcesByTarget;\n',
              '            this.sourcesByTarget = sourcesByTarget;\n            this.sourceStates = sourceStates;\n',
              'context source state assignment')
          p.write_text(t)

          p = Path('src/main/java/dev/antikytheramechanism/sublevel/MiniWorldEnvironment.java')
          t = p.read_text()
          old = '''        BlockState hostState;
        if (pendingContraption) {
            hostState = manager.pendingContraptionBoundaryState(ownerId, hostPosition)
                    .orElse(Blocks.AIR.defaultBlockState());
        } else {
            if (!level.hasChunkAt(hostPosition)) return null;
            hostState = level.getChunkAt(hostPosition).getBlockState(hostPosition);
        }
'''
          new = '''        BlockState hostState = SableAssemblyMoveContext.frozenMovedBlockState(level, hostPosition);
        if (hostState == null && pendingContraption) {
            hostState = manager.pendingContraptionBoundaryState(ownerId, hostPosition)
                    .orElse(Blocks.AIR.defaultBlockState());
        } else if (hostState == null) {
            if (!level.hasChunkAt(hostPosition)) return null;
            hostState = level.getChunkAt(hostPosition).getBlockState(hostPosition);
        }
'''
          t = once(t, old, new, 'macro boundary snapshot')
          p.write_text(t)

          p = Path('src/main/java/dev/antikytheramechanism/sublevel/FrameFaceSupport.java')
          t = p.read_text()
          old = '''            // addBlocksToWorld's synchronous placement context survives through its RETURN injection,
            // while finalizeContraptionPlacement deliberately removes the durable journal before
            // reconnecting neighbours. In that post-commit/pre-unwind interval the physical Frame,
            // frameIndex and committed orientation are already authoritative. Fall through to the
            // normal mapping instead of treating the now-stale target context as a failed journal.
        }
'''
          new = '''            // addBlocksToWorld's synchronous placement context survives through its RETURN injection,
            // while finalizeContraptionPlacement removes the durable journal before neighbour
            // reconnect. In that post-commit/pre-unwind interval require the committed graph to
            // match every validated target field and keep using that mapping until the wrapper exits;
            // Sable child alignment may legitimately trail this synchronous commit by a lifecycle step.
            MechanismAssembly committed = manager.getAssemblyAt(framePosition).orElse(null);
            if (move == null
                    && committed != null
                    && committed.id().equals(target.assemblyId())
                    && !manager.isContentRecoveryLocked(target.assemblyId())
                    && manager.pendingPistonMove(target.assemblyId()).isEmpty()
                    && committed.orientation().equals(target.orientation())
                    && committed.frames().equals(target.targetFrames())
                    && committed.logicalFrameOffset(framePosition).equals(target.logicalFrameOffset())
                    && !target.targetFrames().contains(framePosition.relative(outwardFace))) {
                return new ServerSupportView(
                        committed,
                        committed.orientation(),
                        committed.logicalFrameOffset(framePosition),
                        committed.frames());
            }
        }
'''
          t = once(t, old, new, 'Create post-commit support view')
          p.write_text(t)
          PY
          git diff --check
          ./gradlew --no-daemon compileJava --console=plain
          git config user.name 'Antikythera Runtime Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/antikytheramechanism/sublevel/SableAssemblyMoveContext.java src/main/java/dev/antikytheramechanism/sublevel/MiniWorldEnvironment.java
          git commit -m 'Freeze carried macro state during Sable moves'
          git add src/main/java/dev/antikytheramechanism/sublevel/FrameFaceSupport.java
          git commit -m 'Preserve Create support through placement unwind'
          git push origin HEAD:agent/fix-runtime-gametests
