name: Apply Embedded Accessor Fixture Repair
on:
  push:
    branches: [agent/fix-runtime-gametests]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Stage embedded accessor fixture repair' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-gametests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore local EmbeddedPlotLevelAccessor coordinates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # EmbeddedPlotLevelAccessor is local-coordinate based: it adds plot.getCenterBlock()
          # internally. Passing MechanismSubLevelService.toPlotPosition(...) to it translates twice.
          for name in [
              'CreateBoundaryLampFrameOrientationGameTests.java',
              'RotatedDockLampStateGameTests.java',
          ]:
              path = Path('src/main/java/dev/antikytheramechanism/assembly') / name
              text = path.read_text()
              text = text.replace(
                  '        BlockPos global = MechanismSubLevelService.toPlotPosition(child, local);\n'
                  '        BlockState before = child.getPlot().getEmbeddedLevelAccessor().getBlockState(global);',
                  '        BlockState before = child.getPlot().getEmbeddedLevelAccessor().getBlockState(local);')
              text = text.replace('setBlock(global, lamp, Block.UPDATE_ALL)',
                                  'setBlock(local, lamp, Block.UPDATE_ALL)')
              text = text.replace('getBlockState(global).equals(lamp)',
                                  'getBlockState(local).equals(lamp)')
              text = text.replace(
                  '            BlockPos global = MechanismSubLevelService.toPlotPosition(child, local);\n'
                  '            BlockState current = child.getPlot().getEmbeddedLevelAccessor().getBlockState(global);',
                  '            BlockState current = child.getPlot().getEmbeddedLevelAccessor().getBlockState(local);')
              text = text.replace('setBlock(global, lit, Block.UPDATE_ALL)',
                                  'setBlock(local, lit, Block.UPDATE_ALL)')
              text = text.replace('getBlockState(global).equals(lit)',
                                  'getBlockState(local).equals(lit)')
              text = text.replace(
                  '            BlockPos global = MechanismSubLevelService.toPlotPosition(child, local);\n'
                  '            BlockState state = child.getPlot().getEmbeddedLevelAccessor().getBlockState(global);',
                  '            BlockState state = child.getPlot().getEmbeddedLevelAccessor().getBlockState(local);')
              if 'BlockPos global = MechanismSubLevelService.toPlotPosition(child, local);' in text:
                  raise SystemExit(f'{name}: stale double-translated helper coordinate remains')
              path.write_text(text)

          path = Path('src/main/java/dev/antikytheramechanism/assembly/FrameBoundaryRegressionGameTests.java')
          text = path.read_text()
          text = one(
              text,
              '                BlockPos miniGlobal = MechanismSubLevelService.toPlotPosition(child, miniLocal);\n'
              '                BlockState support = Blocks.STONE.defaultBlockState();\n'
              '                boolean changed = child.getPlot().getEmbeddedLevelAccessor()\n'
              '                        .setBlock(miniGlobal, support, Block.UPDATE_ALL);\n'
              '                check(changed || child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal).equals(support),',
              '                BlockState support = Blocks.STONE.defaultBlockState();\n'
              '                boolean changed = child.getPlot().getEmbeddedLevelAccessor()\n'
              '                        .setBlock(miniLocal, support, Block.UPDATE_ALL);\n'
              '                check(changed || child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal).equals(support),',
              'frame-boundary local accessor')
          path.write_text(text)

          path = Path('src/main/java/dev/antikytheramechanism/sublevel/SableRelocationGameTests.java')
          text = path.read_text()

          text = one(text,
              'check(child.getPlot().getEmbeddedLevelAccessor().setBlock(miniGlobal, wire, Block.UPDATE_ALL),',
              'check(child.getPlot().getEmbeddedLevelAccessor().setBlock(miniLocal, wire, Block.UPDATE_ALL),',
              'carried-support wire seed')
          text = text.replace(
              'child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal)\n                                .canSurvive(level, miniGlobal)',
              'child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal)\n                                .canSurvive(level, miniGlobal)')
          text = one(text,
              'check(child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal).is(Blocks.REDSTONE_WIRE),',
              'check(child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal).is(Blocks.REDSTONE_WIRE),',
              'carried-support wire read')

          text = one(text,
              '                BlockPos miniGlobal = MechanismSubLevelService.toPlotPosition(child, miniLocal);\n'
              '                check(child.getPlot().getEmbeddedLevelAccessor().setBlock(miniGlobal, support, Block.UPDATE_ALL),',
              '                check(child.getPlot().getEmbeddedLevelAccessor().setBlock(miniLocal, support, Block.UPDATE_ALL),',
              'mini-backed support face')

          text = one(text,
              '        BlockPos miniLocal = MiniCoordinateMapper.frameToMini(assembly, framePos, 0, 0, 0);\n'
              '        BlockPos miniGlobal = MechanismSubLevelService.toPlotPosition(child, miniLocal);\n'
              '        BlockState payload = Blocks.STONE.defaultBlockState();\n'
              '        boolean seeded = child.getPlot().getEmbeddedLevelAccessor().setBlock(miniGlobal, payload, Block.UPDATE_ALL);\n'
              '        check(seeded || child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal).equals(payload),',
              '        BlockPos miniLocal = MiniCoordinateMapper.frameToMini(assembly, framePos, 0, 0, 0);\n'
              '        BlockState payload = Blocks.STONE.defaultBlockState();\n'
              '        boolean seeded = child.getPlot().getEmbeddedLevelAccessor().setBlock(miniLocal, payload, Block.UPDATE_ALL);\n'
              '        check(seeded || child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal).equals(payload),',
              'sole-frame seed')
          text = one(text,
              'check(child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal).isAir(),',
              'check(child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal).isAir(),',
              'sole-frame post-break read')

          text = one(text,
              '        BlockPos miniLocal = MiniCoordinateMapper.frameToMini(assembly, rootFrame, 1, 0, 1);\n'
              '        BlockPos miniGlobal = MechanismSubLevelService.toPlotPosition(child, miniLocal);\n'
              '        BlockState payload = Blocks.IRON_BLOCK.defaultBlockState();\n'
              '        boolean seeded = child.getPlot().getEmbeddedLevelAccessor().setBlock(miniGlobal, payload, Block.UPDATE_ALL);\n'
              '        check(seeded || child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal).equals(payload),',
              '        BlockPos miniLocal = MiniCoordinateMapper.frameToMini(assembly, rootFrame, 1, 0, 1);\n'
              '        BlockState payload = Blocks.IRON_BLOCK.defaultBlockState();\n'
              '        boolean seeded = child.getPlot().getEmbeddedLevelAccessor().setBlock(miniLocal, payload, Block.UPDATE_ALL);\n'
              '        check(seeded || child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal).equals(payload),',
              'round-trip seed')
          text = one(text,
              'check(child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniGlobal).is(Blocks.IRON_BLOCK),',
              'check(child.getPlot().getEmbeddedLevelAccessor().getBlockState(miniLocal).is(Blocks.IRON_BLOCK),',
              'round-trip payload read')

          path.write_text(text)
          PY

          git diff --check
          ./gradlew --no-daemon compileJava --console=plain
          git config user.name 'Antikythera Runtime Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/dev/antikytheramechanism/assembly/CreateBoundaryLampFrameOrientationGameTests.java \
            src/main/java/dev/antikytheramechanism/assembly/RotatedDockLampStateGameTests.java \
            src/main/java/dev/antikytheramechanism/assembly/FrameBoundaryRegressionGameTests.java \
            src/main/java/dev/antikytheramechanism/sublevel/SableRelocationGameTests.java
          git commit -m 'Use local coordinates for embedded plot fixtures'
          git push origin HEAD:agent/fix-runtime-gametests
