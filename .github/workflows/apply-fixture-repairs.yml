name: Apply Managed Placement Routing Repair
on:
  push:
    branches: ['agent/fix-runtime-gametests']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Stage managed placement routing repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-gametests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Route vanilla placement into managed child Level
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(t,o,n,label):
              c=t.count(o)
              if c != 1: raise SystemExit(f'{label}: expected 1, got {c}')
              return t.replace(o,n,1)

          p=Path('src/main/java/dev/antikytheramechanism/interaction/MiniPlacementRouter.java')
          t=p.read_text()
          old='''        BlockPos globalTarget = MechanismSubLevelService.toPlotPosition(subLevel, miniPosition);
        BlockState before = level.getChunkAt(globalTarget).getBlockState(globalTarget);
        if (!before.canBeReplaced()) return InteractionResult.FAIL;

        BlockPos syntheticClickedPos = parentSupport
                ? virtualSupportPosition(globalTarget, logicalClickedFace)
                : globalTarget;
        Vec3 localHitLocation = syntheticHitLocation(syntheticClickedPos, logicalClickedFace, logicalSelection);
        BlockHitResult localHit = new BlockHitResult(localHitLocation, logicalClickedFace, syntheticClickedPos, false);

        InteractionResult placementResult;
        int previousBypass = BYPASS_DEPTH.get();
        BYPASS_DEPTH.set(previousBypass + 1);
        try {
            if (parentSupport) {
                placementResult = MiniWorldEnvironment.withVirtualReads(
                        () -> stack.useOn(new UseOnContext(player, hand, localHit)));
            } else {
                placementResult = stack.useOn(new UseOnContext(player, hand, localHit));
            }
        } finally {
            if (previousBypass == 0) BYPASS_DEPTH.remove(); else BYPASS_DEPTH.set(previousBypass);
        }

        BlockState after = level.getChunkAt(globalTarget).getBlockState(globalTarget);
        boolean placed = placementResult.consumesAction() && !after.isAir() && !after.equals(before);
'''
          new='''        BlockState before = subLevel.getPlot().getEmbeddedLevelAccessor().getBlockState(miniPosition);
        if (!before.canBeReplaced()) return InteractionResult.FAIL;

        // Vanilla must execute against the managed ServerSubLevel, not the root ServerLevel chunk
        // that happens to occupy Sable's hidden plot coordinates. The latter may contain ordinary
        // generated terrain and is not authoritative mini storage.
        BlockPos syntheticClickedPos = parentSupport
                ? virtualSupportPosition(miniPosition, logicalClickedFace)
                : miniPosition;
        Vec3 localHitLocation = syntheticHitLocation(syntheticClickedPos, logicalClickedFace, logicalSelection);
        BlockHitResult localHit = new BlockHitResult(localHitLocation, logicalClickedFace, syntheticClickedPos, false);
        UseOnContext miniContext = new UseOnContext(subLevel, player, hand, stack, localHit);

        InteractionResult placementResult;
        int previousBypass = BYPASS_DEPTH.get();
        BYPASS_DEPTH.set(previousBypass + 1);
        try {
            if (parentSupport) {
                placementResult = MiniWorldEnvironment.withVirtualReads(() -> stack.useOn(miniContext));
            } else {
                placementResult = stack.useOn(miniContext);
            }
        } finally {
            if (previousBypass == 0) BYPASS_DEPTH.remove(); else BYPASS_DEPTH.set(previousBypass);
        }

        BlockState after = subLevel.getPlot().getEmbeddedLevelAccessor().getBlockState(miniPosition);
        boolean placed = placementResult.consumesAction() && !after.isAir() && !after.equals(before);
'''
          t=once(t,old,new,'MiniPlacementRouter managed Level route')
          p.write_text(t)
          PY
          git diff --check
          ./gradlew --no-daemon compileJava --console=plain
          git config user.name 'Antikythera Runtime Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/antikytheramechanism/interaction/MiniPlacementRouter.java
          git commit -m 'Route mini BlockItem placement through managed SubLevel'
          git push origin HEAD:agent/fix-runtime-gametests
