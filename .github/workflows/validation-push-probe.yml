name: Validation Push Probe

on:
  push:
    branches:
      - 'agent/validate-sable-2.0.5-stack-1.3.1'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark probe success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          echo "push workflow ran at $(date -u +%FT%TZ)" > .validation-push-probe-ran
          git add -- .validation-push-probe-ran
          git commit -m 'Mark validation push workflow success'
          git push origin HEAD:agent/validate-sable-2.0.5-stack-1.3.1
