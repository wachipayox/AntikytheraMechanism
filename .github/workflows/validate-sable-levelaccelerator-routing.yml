name: Validate Sable LevelAccelerator routing

on:
  push:
    branches:
      - 'agent/validate-sable-levelaccelerator-routing-final'

permissions:
  contents: write

concurrency:
  group: validate-sable-levelaccelerator-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe
          set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false --console=plain > probe/core-${{ matrix.run }}.log 2>&1
          echo "$?" > probe/core-${{ matrix.run }}.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levelaccelerator-core-${{ matrix.run }}-${{ github.sha }}
          path: probe/*
          if-no-files-found: error

  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-sable-levelaccelerator-routing-final
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'levelaccelerator-core-*-${{ github.sha }}'
          path: ci-final-host-routing
          merge-multiple: true
      - shell: bash
        run: |
          mkdir -p ci-final-host-routing
          {
            echo "validated_sha=${GITHUB_SHA}"
            for f in ci-final-host-routing/*.status; do
              [ -e "$f" ] || continue
              echo "$(basename "$f" .status)=$(cat "$f")"
            done
          } > ci-final-host-routing/summary.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/validate-sable-levelaccelerator-routing-final
          git add ci-final-host-routing
          git diff --cached --quiet && exit 0
          git commit -m "Record final Sable routing validation"
          git push origin HEAD:agent/validate-sable-levelaccelerator-routing-final
