name: Frame Presentation Manager Apply

on:
  push:
    branches:
      - agent/frame-shell-modes-and-skins
    paths:
      - tools/apply_frame_presentation_manager.py
      - .github/workflows/frame-presentation-manager-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply manager transformation
        run: python tools/apply_frame_presentation_manager.py
      - name: Verify generated diff
        run: git diff --check
      - name: Commit generated manager changes and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_frame_presentation_manager.py .github/workflows/frame-presentation-manager-apply.yml
          git add src/main/java/dev/antikytheramechanism/assembly/MechanismAssemblyManager.java
          git commit -m "Integrate assembly frame presentation lifecycle"
          git push origin HEAD:agent/frame-shell-modes-and-skins
