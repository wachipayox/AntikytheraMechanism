name: Frame Presentation Compile Validation

on:
  push:
    branches:
      - agent/frame-shell-modes-and-skins
    paths:
      - .github/workflows/frame-presentation-compile.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and record result
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace > frame-presentation-build.log 2>&1
          status=$?
          set -e
          mkdir -p .validation
          {
            echo "exit_code=$status"
            echo "commit=$(git rev-parse HEAD)"
            echo "--- tail ---"
            tail -n 240 frame-presentation-build.log
          } > .validation/frame-presentation-build-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frame-presentation-compile.yml
          git add .validation/frame-presentation-build-result.txt
          git commit -m "Record frame presentation compile validation"
          git push origin HEAD:agent/frame-shell-modes-and-skins
          exit $status
