name: Diagnose ChunkMap And Revert Invalid Hook

on:
  push:
    branches:
      - 'agent/fix-runtime-gametests'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-gametests
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove invalid publication hook
        shell: bash
        run: |
          rm -f src/main/java/dev/antikytheramechanism/mixin/ChunkMapAccessor.java
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/resources/antikytheramechanism.mixins.json')
          text = p.read_text().replace('"ChunkMapAccessor",', '')
          p.write_text(text)

          p = Path('src/main/java/dev/antikytheramechanism/sublevel/MechanismSubLevelService.java')
          text = p.read_text()
          text = text.replace('import dev.antikytheramechanism.mixin.ChunkMapAccessor;\n', '')
          block = '''        // Sable inserts a fresh plot holder into ChunkMap.updatingChunkMap and marks the map dirty.
          // The normal visible-map promotion happens later in the server tick, but first mini placement
          // addresses this child synchronously. Publish the holder now so ServerLevel reads/writes cannot
          // fall through to the vanilla chunk that previously occupied the reserved plot coordinate.
          ((ChunkMapAccessor) (Object) level.getChunkSource().chunkMap).antikytheramechanism$promoteChunkMap();
          '''
          if block not in text:
              raise SystemExit('invalid publication block not found')
          p.write_text(text.replace(block, '', 1))
          PY
      - name: Compile reverted tree
        run: ./gradlew --no-daemon compileJava --console=plain
      - name: Inspect runtime ChunkMap class
        shell: bash
        run: |
          set -o pipefail
          : > chunkmap-javap.txt
          while IFS= read -r jar; do
            if jar tf "$jar" 2>/dev/null | grep -q '^net/minecraft/server/level/ChunkMap.class$'; then
              echo "=== $jar ===" >> chunkmap-javap.txt
              javap -p -classpath "$jar" net.minecraft.server.level.ChunkMap >> chunkmap-javap.txt 2>&1 || true
              echo >> chunkmap-javap.txt
            fi
          done < <(find ~/.gradle/caches -type f -name '*.jar' 2>/dev/null)
          test -s chunkmap-javap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chunkmap-javap
          path: chunkmap-javap.txt
      - name: Commit hook revert
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/main/java/dev/antikytheramechanism/mixin/ChunkMapAccessor.java \
                     src/main/java/dev/antikytheramechanism/sublevel/MechanismSubLevelService.java \
                     src/main/resources/antikytheramechanism.mixins.json
          git diff --cached --check
          git commit -m 'Remove invalid ChunkMap publication hook'
          git push origin HEAD:agent/fix-runtime-gametests
