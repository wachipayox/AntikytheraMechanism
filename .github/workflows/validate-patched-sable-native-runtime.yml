name: Diagnose patched Sable GameTest runtime

on:
  push:
    branches:
      - agent/validate-patched-sable-native-runtime
    paths:
      - '.github/workflows/validate-patched-sable-native-runtime.yml'
      - '.native-runtime-validation-trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/validate-patched-sable-native-runtime
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run GameTest and capture output
        id: gametest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew runGameTestServer --stacktrace > gametest-full.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "source_head=cf38db69ff6291c557b0c6f4cf64dd656ecd68d4"
            echo "exit_code=$code"
            echo "run_id=$GITHUB_RUN_ID"
            echo
            echo "===== ERROR / TEST SUMMARY LINES ====="
            grep -E -i -n -C 3 'FAILURE|FAILED|GameTest|Assertion|Exception|UnsatisfiedLinkError|tests? failed|required tests|sable|rapier|patched native' gametest-full.log | tail -n 350 || true
            echo
            echo "===== FINAL 250 LINES ====="
            tail -n 250 gametest-full.log
          } > .native-runtime-gametest-diagnostic
          exit "$code"

      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- .native-runtime-gametest-diagnostic
          git commit -m 'Record GameTest runtime diagnostic' || true
          git push origin HEAD:agent/validate-patched-sable-native-runtime
