name: Validate patched Sable native runtime

on:
  push:
    branches:
      - agent/validate-patched-sable-native-runtime
    paths:
      - '.github/workflows/validate-patched-sable-native-runtime.yml'
      - '.native-runtime-validation-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/validate-patched-sable-native-runtime
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build integrated mod
        id: build
        continue-on-error: true
        run: ./gradlew build

      - name: Create real native loader smoke test
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p src/test/java/dev/antikytheramechanism/compat/offroad
          cat > src/test/java/dev/antikytheramechanism/compat/offroad/PatchedSableNativeRuntimeSmokeTest.java <<'JAVA'
          package dev.antikytheramechanism.compat.offroad;

          import org.junit.jupiter.api.Test;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          final class PatchedSableNativeRuntimeSmokeTest {
              @Test
              void loadsBundledLinuxX8664Native() {
                  assertTrue(
                          PatchedSableRapierNativeLoader.tryLoadPatchedNative(),
                          () -> "patched native failed to load: " + PatchedSableRapierNativeLoader.failure());
                  assertTrue(PatchedSableRapierNativeLoader.isLoaded());
                  assertEquals("sable_rapier_x86_64_linux.so", PatchedSableRapierNativeLoader.loadedName());
                  assertEquals("none", PatchedSableRapierNativeLoader.failure());
              }
          }
          JAVA

      - name: Load patched Sable native through production loader
        id: native_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./gradlew test --tests dev.antikytheramechanism.compat.offroad.PatchedSableNativeRuntimeSmokeTest --rerun-tasks

      - name: Run NeoForge GameTest runtime
        id: gametest
        if: steps.native_smoke.outcome == 'success'
        continue-on-error: true
        run: ./gradlew runGameTestServer

      - name: Record validation result
        if: always()
        run: |
          printf 'source_head=cf38db69ff6291c557b0c6f4cf64dd656ecd68d4\nbuild=%s\nnative_loader_smoke=%s\ngametest=%s\nrun_id=%s\n' \
            '${{ steps.build.outcome }}' \
            '${{ steps.native_smoke.outcome }}' \
            '${{ steps.gametest.outcome }}' \
            "$GITHUB_RUN_ID" > .native-runtime-validation-result
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- .native-runtime-validation-result
          git commit -m 'Record patched Sable native runtime validation' || true
          git push origin HEAD:agent/validate-patched-sable-native-runtime

      - name: Enforce validation result
        if: always()
        run: |
          test '${{ steps.build.outcome }}' = 'success'
          test '${{ steps.native_smoke.outcome }}' = 'success'
          test '${{ steps.gametest.outcome }}' = 'success'
