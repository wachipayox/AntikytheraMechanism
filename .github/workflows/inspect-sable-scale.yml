name: Inspect Sable Scale artifact

on:
  push:
    branches:
      - agent/feature-schematic-frame-persistence
    paths:
      - '.github/workflows/inspect-sable-scale.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve runtime
        run: ./gradlew -q dependencies --configuration runtimeClasspath >/tmp/deps.txt
      - name: Disassemble exact Sable Scale jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find ~/.gradle/caches -type f \( -name '*sable-scaling*8564797*.jar' -o -name '*sable-scale*.jar' \) | head -n1)"
          if [[ -z "${JAR}" ]]; then
            echo 'Sable Scale jar not found. Candidate jars:'
            find ~/.gradle/caches -type f -name '*.jar' | grep -Ei 'sable|1607775|8564797' || true
            exit 1
          fi
          echo "SABLE_SCALE_JAR=${JAR}"
          unzip -p "${JAR}" META-INF/neoforge.mods.toml 2>/dev/null | head -120 || true
          echo '--- MIXIN JSON ---'
          for f in $(jar tf "${JAR}" | grep -E 'mixins.*json$|.*mixins.json$'); do
            echo "### ${f}"
            unzip -p "${JAR}" "${f}" || true
            echo
          done
          echo '--- RapierConstraintScaleMixin ---'
          javap -classpath "${JAR}" -c -p dev.sablescale.scale.mixin.RapierConstraintScaleMixin
          echo '--- ScaledConstraints ---'
          javap -classpath "${JAR}" -c -p dev.sablescale.scale.ScaledConstraints
          echo '--- MergedMassTrackerMixin ---'
          javap -classpath "${JAR}" -c -p dev.sablescale.scale.mixin.MergedMassTrackerMixin
