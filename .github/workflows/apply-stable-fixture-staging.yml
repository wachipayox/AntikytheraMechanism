name: Apply Stable Fixture Staging

on:
  push:
    branches:
      - 'agent/fix-runtime-gametests'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-gametests
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage managed-child fixtures after Sable publishes plot chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          COMMENT = (
              "\n        // Allow Sable's newly registered plot holder to become visible through ServerLevel\n"
              "        // before authoritative fixture writes address the managed child.\n"
              "        helper.runAfterDelay(2, () -> {\n"
          )

          def wrap_method(path, signature, next_marker, anchor):
              p = Path(path)
              text = p.read_text()
              start = text.index(signature)
              end = text.index(next_marker, start)
              method = text[start:end]
              if "newly registered plot holder" in method:
                  raise SystemExit(f"{signature} is already staged")
              if method.count(anchor) != 1:
                  raise SystemExit(f"expected exactly one anchor in {signature}, got {method.count(anchor)}")
              insert = method.index(anchor) + len(anchor)
              method = method[:insert] + COMMENT + method[insert:]
              close = method.rfind("\n    }")
              if close < 0:
                  raise SystemExit(f"could not find method close for {signature}")
              method = method[:close] + "\n        });" + method[close:]
              p.write_text(text[:start] + method + text[end:])

          create_boundary = "src/main/java/dev/antikytheramechanism/assembly/CreateBoundaryLampFrameOrientationGameTests.java"
          wrap_method(
              create_boundary,
              "    private static void exerciseInFlight(GameTestHelper helper, Direction frameFacing) {",
              "\n    private static void exerciseRotatedStop",
              "        ServerSubLevel child = requireChild(level, assembly);\n",
          )
          wrap_method(
              create_boundary,
              "    private static void exerciseRotatedStop(GameTestHelper helper, Direction targetFacing) {",
              "\n    private static ServerSubLevel requireChild",
              "        ServerSubLevel child = requireChild(level, assembly);\n",
          )

          rotated = "src/main/java/dev/antikytheramechanism/assembly/RotatedDockLampStateGameTests.java"
          wrap_method(
              rotated,
              "    private static void exercise(GameTestHelper helper, Direction targetFacing) {",
              "\n    private static void seedManagedMiniLamp",
              "        helper.assertTrue(child != null && !child.isRemoved(), \"could not materialize managed child\");\n",
          )

          sable = "src/main/java/dev/antikytheramechanism/sublevel/SableRelocationGameTests.java"
          wrap_method(
              sable,
              "    public static void sableAssemblyKeepsCarriedMacroSupport(GameTestHelper helper) {",
              "\n    @GameTest(template = \"frame_rotation_empty\", timeoutTicks = 200)\n    public static void miniBackedMacroAttachmentSurvivesSableAssemblyAndDisassembly",
              "        check(child != null && !child.isRemoved(), \"could not materialize managed mini world\");\n",
          )
          wrap_method(
              sable,
              "    public static void solePopulatedFrameSurvivesMiniBreakAfterSableAssembly(GameTestHelper helper) {",
              "\n    @GameTest(template = \"frame_rotation_empty\", timeoutTicks = 200)\n    public static void populatedFrameRoundTripThroughSableMoveBlocks",
              "        check(child != null && !child.isRemoved(), \"could not materialize managed mini world\");\n",
          )
          PY
      - name: Compile staged fixtures
        run: ./gradlew --no-daemon compileJava --console=plain
      - name: Commit staged fixture setup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/dev/antikytheramechanism/assembly/CreateBoundaryLampFrameOrientationGameTests.java \
                  src/main/java/dev/antikytheramechanism/assembly/RotatedDockLampStateGameTests.java \
                  src/main/java/dev/antikytheramechanism/sublevel/SableRelocationGameTests.java
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m 'Stabilize managed-child GameTest setup'
          git push origin HEAD:agent/fix-runtime-gametests
