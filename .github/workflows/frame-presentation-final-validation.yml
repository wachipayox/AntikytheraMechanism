name: Frame Presentation Final Validation

on:
  push:
    branches:
      - agent/frame-shell-modes-and-skins
    paths:
      - .github/workflows/frame-presentation-final-validation.yml

permissions:
  contents: write
  actions: read

jobs:
  current-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build current feature
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          git diff --check 044c1d57401b3c95a3193d8540f5ec7a97635787 HEAD > /tmp/diffcheck.log 2>&1
          diff_status=$?
          timeout --signal=TERM --kill-after=30s 720s ./gradlew --no-daemon build --stacktrace > /tmp/build.log 2>&1
          status=$?
          set -e
          {
            echo "=== current-build ==="
            echo "validated_code_parent=65f51d3f76a923f844baa0180aa7a1b897ea9e1a"
            echo "diff_check_exit=${diff_status}"
            cat /tmp/diffcheck.log || true
            echo "exit_code=${status}"
            grep -E 'BUILD (SUCCESSFUL|FAILED)|error:|Exception|ERROR|Caused by|MixinApplyError|InjectionError|NoClassDefFoundError|ClassNotFoundException' /tmp/build.log | tail -n 220 || true
            echo "--- tail ---"
            tail -n 180 /tmp/build.log || true
          } > validation-current-build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-current-build
          path: validation-current-build.txt

  current-simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run current Create plus Simulated GameTests
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 720s ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/current-simulated.log 2>&1
          status=$?
          set -e
          {
            echo "=== current-simulated ==="
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|framepresentation|rootforeignroot|bearingroundtrip|failed!|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by|MixinApplyError|InjectionError|NoClassDefFoundError|ClassNotFoundException' /tmp/current-simulated.log | tail -n 360 || true
            echo "--- tail ---"
            tail -n 260 /tmp/current-simulated.log || true
          } > validation-current-simulated.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-current-simulated
          path: validation-current-simulated.txt

  baseline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 044c1d57401b3c95a3193d8540f5ec7a97635787
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run baseline CORE until completion or native freeze
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 240s ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false --console=plain > /tmp/baseline-core.log 2>&1
          status=$?
          set -e
          {
            echo "=== baseline-core ==="
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|FREEZE DUMP|DetachedMixedScaleAssemblyGameTests|Rapier3D.setLocalBounds|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by' /tmp/baseline-core.log | tail -n 300 || true
            echo "--- tail ---"
            tail -n 220 /tmp/baseline-core.log || true
          } > validation-baseline-core.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-baseline-core
          path: validation-baseline-core.txt

  baseline-create:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 044c1d57401b3c95a3193d8540f5ec7a97635787
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run baseline Create-only until completion or native freeze
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 240s ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=false --console=plain > /tmp/baseline-create.log 2>&1
          status=$?
          set -e
          {
            echo "=== baseline-create ==="
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|FREEZE DUMP|DetachedMixedScaleAssemblyGameTests|Rapier3D.setLocalBounds|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by' /tmp/baseline-create.log | tail -n 300 || true
            echo "--- tail ---"
            tail -n 220 /tmp/baseline-create.log || true
          } > validation-baseline-create.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-baseline-create
          path: validation-baseline-create.txt

  baseline-simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 044c1d57401b3c95a3193d8540f5ec7a97635787
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run baseline Create plus Simulated GameTests
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 600s ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/baseline-simulated.log 2>&1
          status=$?
          set -e
          {
            echo "=== baseline-simulated ==="
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|diagonalseparateframesinsameforeignhostusenativecogratio|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by' /tmp/baseline-simulated.log | tail -n 320 || true
            echo "--- tail ---"
            tail -n 240 /tmp/baseline-simulated.log || true
          } > validation-baseline-simulated.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-baseline-simulated
          path: validation-baseline-simulated.txt

  collect:
    if: always()
    needs: [current-build, current-simulated, baseline-core, baseline-create, baseline-simulated]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          merge-multiple: true
          path: /tmp/results
      - name: Record final validation and remove harness
        shell: bash
        run: |
          mkdir -p .validation
          {
            echo "base_commit=044c1d57401b3c95a3193d8540f5ec7a97635787"
            echo "validated_code_commit=65f51d3f76a923f844baa0180aa7a1b897ea9e1a"
            echo "workflow_commit=$(git rev-parse HEAD)"
            echo
            for f in \
              /tmp/results/validation-current-build.txt \
              /tmp/results/validation-current-simulated.txt \
              /tmp/results/validation-baseline-core.txt \
              /tmp/results/validation-baseline-create.txt \
              /tmp/results/validation-baseline-simulated.txt; do
              if [ -f "$f" ]; then cat "$f"; else echo "MISSING: $f"; fi
              echo
            done
          } > .validation/frame-presentation-final-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frame-presentation-final-validation.yml
          git add .validation/frame-presentation-final-validation.txt
          git commit -m "Record final frame presentation validation"
          git push origin HEAD:agent/frame-shell-modes-and-skins
