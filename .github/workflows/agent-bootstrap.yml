name: Agent Bootstrap

on:
  push:
    branches:
      - 'agent/**'

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source checkout
        run: tar --exclude=.git -czf antikythera-source.tar.gz .
      - name: Upload source checkout
        uses: actions/upload-artifact@v4
        with:
          name: antikythera-source
          path: antikythera-source.tar.gz
          retention-days: 1
