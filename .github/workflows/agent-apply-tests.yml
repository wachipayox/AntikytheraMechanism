name: Agent Apply Rotation Tests

on:
  push:
    branches:
      - 'agent/create-frame-rotation-fix'

permissions:
  contents: write

jobs:
  apply-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify and apply reviewed tests
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .agent/tests.patch.gz.b64 > /tmp/tests.patch.gz
          echo '502d0ddd8b9ca19cca96892244ebace936470bd39b14079c35f50ebfaf34c631  /tmp/tests.patch.gz' | sha256sum -c -
          gzip -dc /tmp/tests.patch.gz > /tmp/tests.patch
          git apply --check /tmp/tests.patch
          git apply /tmp/tests.patch
          rm -rf .agent
          rm -f .github/workflows/agent-apply-tests.yml
      - name: Compile and unit test applied changes
        run: ./gradlew --no-daemon clean build
      - name: Commit reviewed tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wachii'
          git config user.email 'dani.alvarado.sosa@gmail.com'
          git add -A
          git commit -m 'Add frame rotation transaction GameTests'
          git push origin HEAD:${GITHUB_REF_NAME}
