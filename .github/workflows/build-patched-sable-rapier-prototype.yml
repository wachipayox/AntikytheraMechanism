name: Build patched Sable Rapier prototype

on:
  push:
    paths:
      - '.github/workflows/build-patched-sable-rapier-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patched-sable-rapier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Antikythera
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Clone exact Sable 2.0.3 source
        run: |
          git clone https://github.com/ryanhcode/sable.git /tmp/sable
          cd /tmp/sable
          git checkout 4bc206ee4718f2a7906e4366963ada98eadd78fae

      - name: Add Antikythera transient world-force JNI entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sable/sable_rapier/src/main/rust/rapier/src/lib.rs')
          text = p.read_text()
          marker = 'Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque'
          if marker in text:
              raise SystemExit('JNI prototype already present unexpectedly')
          text += r'''

/// Antikythera diagnostic extension: adds a world-space force and torque to one Sable rigid body.
/// The Java caller removes the exact same vectors after one Rapier step, making this contribution
/// transient without resetting Sable's other persistent external forces (for example buoyancy).
#[unsafe(no_mangle)]
pub extern "system" fn Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque<'local>(
    _env: JNIEnv<'local>,
    _class: JClass<'local>,
    handle: jlong,
    id: jint,
    fx: jdouble,
    fy: jdouble,
    fz: jdouble,
    tx: jdouble,
    ty: jdouble,
    tz: jdouble,
    wake_up: jboolean,
) {
    with_handle(handle, |scene| {
        let sable_data = scene.sable_data.read().unwrap();
        let mut sim_data = scene.sim_data.write().unwrap();
        let rb = get_rigid_body_mut(&mut sim_data, &sable_data, id as LevelColliderID);

        rb.add_force(
            Vec3::new(fx as Real, fy as Real, fz as Real),
            wake_up > 0,
        );
        rb.add_torque(
            Vec3::new(tx as Real, ty as Real, tz as Real),
            wake_up > 0,
        );
    });
}
'''
          p.write_text(text)
          PY

      - name: Build Sable cross-compilation images
        working-directory: /tmp/sable
        run: ./gradlew sable_rapier:buildImages

      - name: Build Windows and Linux x86_64 natives
        working-directory: /tmp/sable
        run: ./gradlew sable_rapier:compileRust-windows-x86_64 sable_rapier:compileRust-linux-x86_64

      - name: Install patched natives into Antikythera resources
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/src/main/resources/natives/antikytheramechanism_sable_rapier"
          mkdir -p "$OUT"
          cp /tmp/sable/sable_rapier/src/main/rust/target/x86_64-pc-windows-msvc/release/sable_rapier.dll \
             "$OUT/sable_rapier_x86_64_windows.dll"
          cp /tmp/sable/sable_rapier/src/main/rust/target/x86_64-unknown-linux-gnu/release/libsable_rapier.so \
             "$OUT/sable_rapier_x86_64_linux.so"
          ls -lh "$OUT"

      - name: Commit patched native resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- src/main/resources/natives/antikytheramechanism_sable_rapier
          git commit -m 'Build patched Sable Rapier force prototype'
          git push origin "HEAD:${GITHUB_REF_NAME}"
