name: Runtime Fix Validation

on:
  push:
    branches:
      - 'agent/fix-runtime-gametests'

concurrency:
  group: runtime-fix-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-sable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve dependencies
        run: ./gradlew --no-daemon dependencies --configuration runtimeClasspath --console=plain >/dev/null
      - name: Inspect Sable level/accessor APIs
        shell: bash
        run: |
          set -e
          find ~/.gradle/caches/modules-2/files-2.1 -type f -name '*.jar' | grep -E '/(sable|Sable)[^/]*/' | sort
          JAR=$(find ~/.gradle/caches/modules-2/files-2.1 -type f -name '*.jar' | grep '/dev.ryanhcode.sable/' | head -1)
          echo "JAR=$JAR"
          jar tf "$JAR" | grep -E 'ServerSubLevel|Embedded.*Accessor|LevelPlot' | head -80
          javap -classpath "$JAR" -public dev.ryanhcode.sable.sublevel.ServerSubLevel || true
          for C in $(jar tf "$JAR" | sed 's#/#.#g;s#\.class$##' | grep -E 'Embedded.*Accessor'); do javap -classpath "$JAR" -public "$C" || true; done

  junit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JUnit
        run: ./gradlew --no-daemon test --console=plain

  gametest:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - create: 'false'
            simulated: 'false'
            label: core
          - create: 'true'
            simulated: 'false'
            label: create
          - create: 'true'
            simulated: 'true'
            label: simulated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer -Pinclude_create=${{ matrix.create }} -Pinclude_simulated=${{ matrix.simulated }} --console=plain 2>&1 | tee /tmp/gametest.log
      - name: Scan GameTest log
        if: always()
        shell: bash
        run: |
          if grep -E 'MixinApplyError|InvalidMixinException|InjectionError|TransformerError|LinkageError|NoClassDefFoundError|ClassNotFoundException|Exception during mod loading|Failed to start the minecraft server|Attempted to load class .* for invalid dist' /tmp/gametest.log \
            | grep -v 'org/jetbrains/annotations/ApiStatus\$ScheduledForRemoval' \
            | grep -v 'Attempted to load class net/minecraft/client/multiplayer/ClientLevel for invalid dist DEDICATED_SERVER'; then
            exit 1
          fi
      - name: Upload failed GameTest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-fix-gametest-${{ matrix.label }}
          path: /tmp/gametest.log
          if-no-files-found: error

  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run build
        run: ./gradlew --no-daemon build --console=plain
