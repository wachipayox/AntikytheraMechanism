name: Agent Clean Profile Diagnostics
on:
  push:
    branches: ['agent/fix-sable-frame-lifecycle-regressions']
permissions:
  contents: write
jobs:
  core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe; set +e
          timeout --signal=TERM 15m ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false --console=plain > probe/core.log 2>&1
          echo "$?" > probe/core.status; exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: clean-core-${{ github.sha }}, path: 'probe/*', if-no-files-found: warn}
  create:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe; set +e
          timeout --signal=TERM 15m ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=false --console=plain > probe/create.log 2>&1
          echo "$?" > probe/create.status; exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: clean-create-${{ github.sha }}, path: 'probe/*', if-no-files-found: warn}
  simulated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          mkdir -p probe; set +e
          timeout --signal=TERM 17m ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > probe/simulated.log 2>&1
          echo "$?" > probe/simulated.status; exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: clean-simulated-${{ github.sha }}, path: 'probe/*', if-no-files-found: warn}
  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [core, create, simulated]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/fix-sable-frame-lifecycle-regressions}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: 'clean-*-${{ github.sha }}', path: ci-clean-profiles, merge-multiple: true}
      - shell: bash
        run: |
          mkdir -p ci-clean-profiles
          { echo "source_sha=${GITHUB_SHA}"; for f in ci-clean-profiles/*.status; do echo "$(basename "$f" .status)=$(cat "$f")"; done; } > ci-clean-profiles/summary.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/fix-sable-frame-lifecycle-regressions
          git add ci-clean-profiles
          git diff --cached --quiet && exit 0
          git commit -m "Record temporary clean profile diagnostics for ${GITHUB_SHA}"
          git push origin HEAD:agent/fix-sable-frame-lifecycle-regressions
