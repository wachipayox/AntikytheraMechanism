name: Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

  materialize-sable205-linux-native:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/integration-current'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integration-current
          fetch-depth: 0

      - name: Check whether Linux 2.0.5 native is already materialized
        id: guard
        shell: bash
        run: |
          if [ -f LINUX_2_0_5_NATIVE_VALIDATION.txt ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Sable 2.0.5 source
        if: steps.guard.outputs.needed == 'true'
        run: |
          git clone --filter=blob:none https://github.com/ryanhcode/sable.git /tmp/sable
          git -C /tmp/sable checkout 6966d2928340de7631abcecf8549904b877df0a8
          test "$(git -C /tmp/sable rev-parse HEAD)" = 6966d2928340de7631abcecf8549904b877df0a8

      - name: Add continuous-force JNI extension
        if: steps.guard.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sable/sable_rapier/src/main/rust/rapier/src/lib.rs')
          text = p.read_text()
          text += r'''

#[unsafe(no_mangle)]
pub extern "system" fn Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque<'local>(
    _env: JNIEnv<'local>,
    _class: JClass<'local>,
    handle: jlong,
    id: jint,
    fx: jdouble,
    fy: jdouble,
    fz: jdouble,
    tx: jdouble,
    ty: jdouble,
    tz: jdouble,
    wake_up: jboolean,
) {
    with_handle(handle, |scene| {
        let sable_data = scene.sable_data.read().unwrap();
        let mut sim_data = scene.sim_data.write().unwrap();
        let rb = get_rigid_body_mut(&mut sim_data, &sable_data, id as LevelColliderID);
        rb.add_force(Vec3::new(fx as Real, fy as Real, fz as Real), wake_up > 0);
        rb.add_torque(Vec3::new(tx as Real, ty as Real, tz as Real), wake_up > 0);
    });
}
'''
          p.write_text(text)
          PY

      - name: Build Linux toolchain image
        if: steps.guard.outputs.needed == 'true'
        working-directory: /tmp/sable
        run: ./gradlew sable_rapier:buildZigbuildImage --console=plain

      - name: Compile Linux x86-64 native
        if: steps.guard.outputs.needed == 'true'
        working-directory: /tmp/sable
        run: ./gradlew sable_rapier:compileRust-linux-x86_64 --console=plain

      - name: Verify, install and record Linux native
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          SRC=/tmp/sable/sable_rapier/src/main/rust/target/x86_64-unknown-linux-gnu/release/libsable_rapier.so
          SYMBOL=Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque
          test -f "$SRC"
          nm -D "$SRC" | grep -F "$SYMBOL"
          OUT=src/main/resources/natives/antikytheramechanism_sable_rapier/sable_rapier_x86_64_linux.so
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$OUT")
          file "$OUT"

          python3 - "$SHA" <<'PY'
          from pathlib import Path
          import sys
          sha = sys.argv[1]
          p = Path('src/main/java/dev/antikytheramechanism/compat/offroad/PatchedSableRapierNativeLoader.java')
          text = p.read_text()
          needle = '    private static final String WINDOWS_X86_64_SHA256 = "2ceedfd65da398ea2d1841d1f84ff550818fa50fc70663df3f8a5c378e5bf166";\n'
          replacement = needle + f'    private static final String LINUX_X86_64_SHA256 = "{sha}";\n'
          if 'LINUX_X86_64_SHA256' not in text:
              text = text.replace(needle, replacement)
          old = '''        if ("sable_rapier_x86_64_windows.dll".equals(nativeName)) {\n            return WINDOWS_X86_64_SHA256;\n        }\n        return null;'''
          new = '''        if ("sable_rapier_x86_64_windows.dll".equals(nativeName)) {\n            return WINDOWS_X86_64_SHA256;\n        }\n        if ("sable_rapier_x86_64_linux.so".equals(nativeName)) {\n            return LINUX_X86_64_SHA256;\n        }\n        return null;'''
          text = text.replace(old, new)
          p.write_text(text)
          PY

          {
            echo "sable_source_sha=6966d2928340de7631abcecf8549904b877df0a8"
            echo "jni_symbol=$SYMBOL"
            echo "jni_symbol_linux=present"
            echo "sha256=$SHA"
            echo "size=$SIZE"
            file "$OUT"
          } > LINUX_2_0_5_NATIVE_VALIDATION.txt

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "$OUT" src/main/java/dev/antikytheramechanism/compat/offroad/PatchedSableRapierNativeLoader.java LINUX_2_0_5_NATIVE_VALIDATION.txt
          git commit -m 'Materialize patched Sable 2.0.5 Linux native'
          git push origin HEAD:agent/integration-current
