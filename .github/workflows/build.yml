name: Build

on: [push]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run targeted lifecycle matrix
        shell: bash
        run: |
          mkdir -p targeted-results
          run_step() {
            name="$1"; shift
            set +e
            timeout --signal=TERM 9m "$@" > "targeted-results/${name}.log" 2>&1
            status=$?
            set -e
            echo "$status" > "targeted-results/${name}.status"
          }

          run_step build ./gradlew --no-daemon build --console=plain
          for n in 1 2 3; do
            run_step "core-${n}" ./gradlew --no-daemon runGameTestServer -Pinclude_create=false -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_targeted --console=plain
          done
          run_step create ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_targeted --console=plain
          for n in 1 2 3; do
            run_step "simulated-${n}" ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true -Pgametest_namespace=antikytheramechanism_targeted --console=plain
          done

          {
            echo "source_sha=${GITHUB_SHA}"
            for f in targeted-results/*.status; do
              echo "$(basename "$f" .status)=$(cat "$f")"
            done
          } > targeted-results/summary.txt

      - name: Publish targeted results
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add targeted-results
          git diff --cached --quiet && exit 0
          git commit -m "Record targeted Sable lifecycle validation"
          git push origin HEAD:agent/validate-targeted-sable-lifecycle-final
