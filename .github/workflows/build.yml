name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

  sable205-linux-native:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/sable205-linux-ci-run2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Sable 2.0.5 source
        run: |
          git clone --filter=blob:none https://github.com/ryanhcode/sable.git /tmp/sable
          git -C /tmp/sable checkout 6966d2928340de7631abcecf8549904b877df0a8
          test "$(git -C /tmp/sable rev-parse HEAD)" = 6966d2928340de7631abcecf8549904b877df0a8

      - name: Add continuous-force JNI extension
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sable/sable_rapier/src/main/rust/rapier/src/lib.rs')
          text = p.read_text()
          text += r'''

#[unsafe(no_mangle)]
pub extern "system" fn Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque<'local>(
    _env: JNIEnv<'local>,
    _class: JClass<'local>,
    handle: jlong,
    id: jint,
    fx: jdouble,
    fy: jdouble,
    fz: jdouble,
    tx: jdouble,
    ty: jdouble,
    tz: jdouble,
    wake_up: jboolean,
) {
    with_handle(handle, |scene| {
        let sable_data = scene.sable_data.read().unwrap();
        let mut sim_data = scene.sim_data.write().unwrap();
        let rb = get_rigid_body_mut(&mut sim_data, &sable_data, id as LevelColliderID);
        rb.add_force(Vec3::new(fx as Real, fy as Real, fz as Real), wake_up > 0);
        rb.add_torque(Vec3::new(tx as Real, ty as Real, tz as Real), wake_up > 0);
    });
}
'''
          p.write_text(text)
          PY

      - name: Build Linux toolchain image
        working-directory: /tmp/sable
        run: ./gradlew sable_rapier:buildZigbuildImage --console=plain

      - name: Compile Linux x86-64 native
        working-directory: /tmp/sable
        run: ./gradlew sable_rapier:compileRust-linux-x86_64 --console=plain

      - name: Verify native and JNI symbol
        run: |
          set -euxo pipefail
          SRC=/tmp/sable/sable_rapier/src/main/rust/target/x86_64-unknown-linux-gnu/release/libsable_rapier.so
          test -f "$SRC"
          nm -D "$SRC" | grep -F Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque
          file "$SRC"
          sha256sum "$SRC"
          mkdir -p /tmp/out
          cp "$SRC" /tmp/out/sable_rapier_x86_64_linux.so

      - uses: actions/upload-artifact@v4
        with:
          name: sable-2.0.5-patched-linux-x86_64
          path: /tmp/out/sable_rapier_x86_64_linux.so
          if-no-files-found: error
