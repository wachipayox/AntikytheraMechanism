name: Native Artifact Push

on:
  push:
    branches:
      - agent/native-artifact-push
    paths:
      - '.github/workflows/build.yml'
      - '.native-artifact-push-trigger'

permissions:
  contents: write

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build patched Sable natives
        run: bash scripts/ci/build_patched_sable_native.sh

      - name: Record success
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          printf 'success\nrun_id=%s\nhead_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .native-artifact-run-state
          git add -- .native-artifact-run-state
          git commit -m 'Record native artifact build success'
          git push origin HEAD:agent/native-artifact-push

      - name: Record failure
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          printf 'failed\nrun_id=%s\nhead_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .native-artifact-run-state
          git add -- .native-artifact-run-state
          git commit -m 'Record native artifact build failure'
          git push origin HEAD:agent/native-artifact-push
