name: Build

on: [push]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        shell: bash
        run: |
          mkdir -p out
          set +e
          timeout --signal=TERM 600 ./gradlew --no-daemon build --console=plain > out/build.log 2>&1
          status=$?
          set -e
          echo "$status" > out/build.status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-build
          path: out

  settlement:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            create: 'false'
            simulated: 'false'
          - profile: create
            create: 'true'
            simulated: 'false'
          - profile: simulated
            create: 'true'
            simulated: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Settlement ${{ matrix.profile }} 3x
        shell: bash
        run: |
          mkdir -p out
          for n in 1 2 3; do
            label="settlement-${{ matrix.profile }}-${n}"
            set +e
            timeout --signal=TERM 360 ./gradlew --no-daemon runGameTestServer \
              -Pinclude_create=${{ matrix.create }} \
              -Pinclude_simulated=${{ matrix.simulated }} \
              -Pgametest_namespace=antikythera_settlement_validation \
              --console=plain > "out/${label}.log" 2>&1
            status=$?
            set -e
            echo "$status" > "out/${label}.status"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-settlement-${{ matrix.profile }}
          path: out

  diagonal:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: create
            create: 'true'
            simulated: 'false'
          - profile: simulated
            create: 'true'
            simulated: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Diagonal FOREIGN ${{ matrix.profile }} 3x
        shell: bash
        run: |
          mkdir -p out
          for n in 1 2 3; do
            label="diagonal-${{ matrix.profile }}-${n}"
            set +e
            timeout --signal=TERM 360 ./gradlew --no-daemon runGameTestServer \
              -Pinclude_create=${{ matrix.create }} \
              -Pinclude_simulated=${{ matrix.simulated }} \
              -Pgametest_namespace=antikythera_diagonal_validation \
              --console=plain > "out/${label}.log" 2>&1
            status=$?
            set -e
            echo "$status" > "out/${label}.status"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-diagonal-${{ matrix.profile }}
          path: out

  fault-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fault-only CORE 5x
        shell: bash
        run: |
          mkdir -p out
          for n in 1 2 3 4 5; do
            label="fault-core-${n}"
            set +e
            timeout --signal=TERM 360 ./gradlew --no-daemon runGameTestServer \
              -Pinclude_create=false \
              -Pinclude_simulated=false \
              -Pgametest_namespace=antikythera_sable_fault_validation \
              --console=plain > "out/${label}.log" 2>&1
            status=$?
            set -e
            echo "$status" > "out/${label}.status"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-fault-only
          path: out

  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: [build, settlement, diagonal, fault-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: sable-*
          path: collected
          merge-multiple: true
      - name: Summarize
        shell: bash
        run: |
          mkdir -p validation-results/sable-active-destination-final
          cp collected/*.log validation-results/sable-active-destination-final/ 2>/dev/null || true
          cp collected/*.status validation-results/sable-active-destination-final/ 2>/dev/null || true
          root=validation-results/sable-active-destination-final
          {
            echo "source_sha=${GITHUB_SHA}"
            for f in "$root"/*.status; do
              [ -e "$f" ] || continue
              name="$(basename "$f" .status)"
              status="$(cat "$f")"
              case "$status" in
                0) label=PASS ;;
                124) label=TIMEOUT ;;
                *) label="FAIL(${status})" ;;
              esac
              echo "${name}=${label}"
            done | sort
            echo "settlement_repetitions_per_profile=3"
            echo "settlement_tests_per_run=4"
            echo "fault_executions_inside_settlement=9"
            echo "fault_only_core_repetitions=5"
            echo "diagonal_repetitions_create=3"
            echo "diagonal_repetitions_simulated=3"
          } > "$root/summary.txt"

          : > "$root/signatures.txt"
          for log in "$root"/*.log; do
            [ -e "$log" ] || continue
            name="$(basename "$log")"
            lifecycle=$(grep -Eic 'Could not journal|SavedData expects a frame|Frame ownership did not follow|recovery-locked|historical Sable destination retained|failed Sable copy lost|could not safely partition' "$log" || true)
            rapier=$(grep -Eic 'Rapier|setLocalBounds|the second body of this constraint' "$log" || true)
            fault=$(grep -Eic 'intentional Sable post-beforeMove fault' "$log" || true)
            echo "${name}: lifecycle_signatures=${lifecycle} rapier_signatures=${rapier} injected_fault_signatures=${fault}" >> "$root/signatures.txt"
          done

          : > "$root/diagnostics.txt"
          for f in "$root"/*.status; do
            [ -e "$f" ] || continue
            status="$(cat "$f")"
            [ "$status" = "0" ] && continue
            name="$(basename "$f" .status)"
            log="$root/${name}.log"
            echo "===== ${name} status=${status} =====" >> "$root/diagnostics.txt"
            grep -E 'GameTest|failed|FAILED|Exception|Error|Rapier|setLocalBounds|the second body of this constraint|All required tests passed|tests? passed' "$log" | tail -n 220 >> "$root/diagnostics.txt" || true
            echo "----- tail -----" >> "$root/diagnostics.txt"
            tail -n 300 "$log" >> "$root/diagnostics.txt"
          done
      - name: Publish validation results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation-results/sable-active-destination-final
          git diff --cached --quiet && exit 0
          git commit -m 'Record final Sable destination blocker validation'
          git push origin HEAD:agent/fix-sable-foreign-host-settlement-race-v3
