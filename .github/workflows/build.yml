name: Native Artifact Push

on:
  push:
    branches:
      - agent/native-artifact-push
    paths:
      - '.github/workflows/build.yml'
      - '.native-artifact-push-trigger'

permissions:
  contents: write

concurrency:
  group: native-artifact-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build, validate, and materialize patched natives
        shell: bash
        run: |
          set -Eeuo pipefail

          STATE="$GITHUB_WORKSPACE/.native-artifact-run-state"
          OUT="$GITHUB_WORKSPACE/src/main/resources/natives/antikytheramechanism_sable_rapier"
          WIN="$OUT/sable_rapier_x86_64_windows.dll"
          LINUX="$OUT/sable_rapier_x86_64_linux.so"
          SYMBOL='Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque'
          SABLE_SHA='4bc206ee4718f2a7906e4366963ada98eadd78fae'
          STAGE='initialization'

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          push_state() {
            git add -- "$STATE"
            if ! git diff --cached --quiet; then
              git commit -m "Native artifact state: $(head -n1 "$STATE")"
              git push origin HEAD:agent/native-artifact-push
            fi
          }

          fail_state() {
            rc=$?
            trap - ERR
            printf 'failed\nstage=%s\nexit_code=%s\nbuilder_sha=%s\n' "$STAGE" "$rc" "$GITHUB_SHA" > "$STATE"
            push_state || true
            exit "$rc"
          }
          trap fail_state ERR

          printf 'started\nstage=%s\nbuilder_sha=%s\nsable_source_sha=%s\n' "$STAGE" "$GITHUB_SHA" "$SABLE_SHA" > "$STATE"
          push_state

          STAGE='clone-sable'
          rm -rf /tmp/sable
          git clone https://github.com/ryanhcode/sable.git /tmp/sable
          git -C /tmp/sable checkout "$SABLE_SHA"

          STAGE='patch-jni'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sable/sable_rapier/src/main/rust/rapier/src/lib.rs')
          text = p.read_text()
          marker = 'Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque'
          if marker in text:
              raise SystemExit('JNI prototype already present unexpectedly')
          text += r'''

/// Antikythera diagnostic extension: add world-space force and torque to one Sable rigid body.
/// Java removes the exact same vectors after one Rapier step so this contribution is transient and
/// does not reset or overwrite Sable's other persistent external forces (notably buoyancy).
#[unsafe(no_mangle)]
pub extern "system" fn Java_dev_antikytheramechanism_compat_offroad_OffroadNativeForceBridge_addWorldForceAndTorque<'local>(
    _env: JNIEnv<'local>,
    _class: JClass<'local>,
    handle: jlong,
    id: jint,
    fx: jdouble,
    fy: jdouble,
    fz: jdouble,
    tx: jdouble,
    ty: jdouble,
    tz: jdouble,
    wake_up: jboolean,
) {
    with_handle(handle, |scene| {
        let sable_data = scene.sable_data.read().unwrap();
        let mut sim_data = scene.sim_data.write().unwrap();
        let rb = get_rigid_body_mut(&mut sim_data, &sable_data, id as LevelColliderID);
        rb.add_force(Vec3::new(fx as Real, fy as Real, fz as Real), wake_up > 0);
        rb.add_torque(Vec3::new(tx as Real, ty as Real, tz as Real), wake_up > 0);
    });
}
'''
          p.write_text(text)
          PY

          STAGE='build-images'
          (cd /tmp/sable && ./gradlew sable_rapier:buildImages)

          STAGE='compile-natives'
          (cd /tmp/sable && ./gradlew sable_rapier:compileRust-windows-x86_64 sable_rapier:compileRust-linux-x86_64)

          STAGE='install-natives'
          mkdir -p "$OUT"
          cp /tmp/sable/sable_rapier/src/main/rust/target/x86_64-pc-windows-msvc/release/sable_rapier.dll "$WIN"
          cp /tmp/sable/sable_rapier/src/main/rust/target/x86_64-unknown-linux-gnu/release/libsable_rapier.so "$LINUX"

          STAGE='validate-files'
          test -s "$WIN"
          test -s "$LINUX"
          file "$WIN"
          file "$LINUX"

          STAGE='validate-linux-export'
          nm -D "$LINUX" | grep -F "$SYMBOL"

          STAGE='validate-binary-format-and-symbols'
          python3 - "$WIN" "$LINUX" "$SYMBOL" <<'PY'
          from pathlib import Path
          import sys

          win = Path(sys.argv[1]).read_bytes()
          linux = Path(sys.argv[2]).read_bytes()
          symbol = sys.argv[3].encode('ascii')

          if not win.startswith(b'MZ'):
              raise SystemExit('Windows native is not a PE image')
          if not linux.startswith(b'\x7fELF'):
              raise SystemExit('Linux native is not an ELF image')
          if symbol not in win:
              raise SystemExit('JNI symbol missing from Windows native export/string table')
          if symbol not in linux:
              raise SystemExit('JNI symbol missing from Linux native export/string table')
          PY

          STAGE='write-validation-report'
          {
            echo "builder_sha=$GITHUB_SHA"
            echo "sable_source_sha=$SABLE_SHA"
            echo "jni_symbol=$SYMBOL"
            echo "jni_symbol_windows=present"
            echo "jni_symbol_linux=present"
            echo
            sha256sum "$WIN" "$LINUX"
            echo
            stat --printf='%n size=%s bytes\n' "$WIN" "$LINUX"
            echo
            file "$WIN" "$LINUX"
          } > "$OUT/VALIDATION.txt"

          STAGE='commit-success'
          printf 'success\nstage=%s\nbuilder_sha=%s\nsable_source_sha=%s\n' "$STAGE" "$GITHUB_SHA" "$SABLE_SHA" > "$STATE"
          git add -- "$STATE" "$OUT"
          git diff --cached --stat
          git commit -m 'Materialize validated patched Sable natives'
          git push origin HEAD:agent/native-artifact-push
          trap - ERR

      - name: Upload patched natives
        uses: actions/upload-artifact@v4
        with:
          name: patched-sable-rapier-natives
          path: src/main/resources/natives/antikytheramechanism_sable_rapier/*
          if-no-files-found: error
          retention-days: 1
