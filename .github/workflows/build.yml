name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

  focused-hidden-geometry:
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - simulated: 'false'
            label: create
          - simulated: 'true'
            label: simulated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Add isolated GameTest run locally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          text = p.read_text()
          marker = "\n        data {\n"
          run = '''
        hiddenGeometryGameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'antikytheramechanism_hidden_geometry_validation'
        }
'''
          if marker not in text:
              raise SystemExit('data run marker not found')
          p.write_text(text.replace(marker, run + marker, 1))
          PY
      - name: Run focused hidden geometry GameTest
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 360s ./gradlew --no-daemon runHiddenGeometryGameTestServer -Pinclude_create=true -Pinclude_simulated=${{ matrix.simulated }} --console=plain 2>&1 | tee validation.log
      - name: Upload failed evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-flight-geometry-${{ matrix.label }}
          path: |
            validation.log
            run/crash-reports/**
            run/logs/**
          if-no-files-found: warn
