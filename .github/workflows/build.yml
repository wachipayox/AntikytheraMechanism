name: Sable Settlement Race Validation

on:
  push:
    branches:
      - 'agent/validate-sable-foreign-host-settlement-race'
    paths-ignore:
      - 'validation-results/**'

permissions:
  contents: write

concurrency:
  group: sable-settlement-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate ordered settlement lifecycle
        id: validation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p validation-results /tmp/sable-validation
          summary=validation-results/summary.txt
          : > "$summary"
          echo "validated_sha=${GITHUB_SHA}" | tee -a "$summary"
          bad_re='Could not journal complete Sable destination|Could not journal Sable relocation|SavedData expects a frame|the second body of this constraint is not a sub-level|Could not install host-contact suppression'

          run_gradle() {
            local label="$1"; shift
            local log="/tmp/sable-validation/${label}.log"
            echo "=== ${label} ==="
            set +e
            timeout --signal=TERM 12m ./gradlew --no-daemon "$@" --console=plain 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            local status
            if [[ $rc -eq 0 ]]; then
              status=PASS
            elif [[ $rc -eq 124 ]]; then
              status=TIMEOUT
            else
              status=FAIL
            fi
            if grep -E "$bad_re" "$log" > "/tmp/sable-validation/${label}.signatures"; then
              cat "/tmp/sable-validation/${label}.signatures"
              if [[ "$status" == PASS ]]; then
                status=FAIL_SIGNATURE
              fi
            fi
            echo "${label}=${status}" | tee -a "$summary"
            [[ "$status" == PASS ]]
          }

          commit_results() {
            cp /tmp/sable-validation/*.signatures validation-results/ 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation-results
            if ! git diff --cached --quiet; then
              git commit -m "[validation-results] Record Sable settlement validation"
              git push origin HEAD:agent/validate-sable-foreign-host-settlement-race
            fi
          }

          fail_targeted() {
            echo "targeted_gate=FAIL" | tee -a "$summary"
            commit_results
            exit 1
          }

          echo "build_stage=START" | tee -a "$summary"
          run_gradle build build || fail_targeted

          # Stage 1: ROOT -> FOREIGN. Compare profiles, then repeat the historically flaky
          # Create+Simulated case five clean JVMs before advancing.
          run_gradle settlement-core-1 runGameTestServer -Pinclude_create=false -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_settlement || fail_targeted
          run_gradle settlement-create-1 runGameTestServer -Pinclude_create=true -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_settlement || fail_targeted
          for i in 1 2 3 4 5; do
            run_gradle "settlement-simulated-${i}" runGameTestServer -Pinclude_create=true -Pinclude_simulated=true -Pgametest_namespace=antikytheramechanism_settlement || fail_targeted
          done

          # Stage 2: FOREIGN -> ROOT only after ROOT -> FOREIGN is stable.
          run_gradle return-core-1 runGameTestServer -Pinclude_create=false -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_return || fail_targeted
          run_gradle return-create-1 runGameTestServer -Pinclude_create=true -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_return || fail_targeted
          for i in 1 2 3 4 5; do
            run_gradle "return-simulated-${i}" runGameTestServer -Pinclude_create=true -Pinclude_simulated=true -Pgametest_namespace=antikytheramechanism_return || fail_targeted
          done

          # Stage 3: downstream Create diagonal only after both settlement directions are stable.
          run_gradle diagonal-create-1 runGameTestServer -Pinclude_create=true -Pinclude_simulated=false -Pgametest_namespace=antikytheramechanism_diagonal || fail_targeted
          for i in 1 2 3 4 5; do
            run_gradle "diagonal-simulated-${i}" runGameTestServer -Pinclude_create=true -Pinclude_simulated=true -Pgametest_namespace=antikytheramechanism_diagonal || fail_targeted
          done
          echo "targeted_gate=PASS" | tee -a "$summary"

          # Full profiles. Run all three Create+Simulated attempts even if one fails so the
          # summary preserves frequency rather than stopping at the first intermittent failure.
          overall=0
          run_gradle full-core runGameTestServer -Pinclude_create=false -Pinclude_simulated=false || overall=1
          run_gradle full-create runGameTestServer -Pinclude_create=true -Pinclude_simulated=false || overall=1
          for i in 1 2 3; do
            run_gradle "full-simulated-${i}" runGameTestServer -Pinclude_create=true -Pinclude_simulated=true || overall=1
          done
          if [[ $overall -eq 0 ]]; then
            echo "full_gate=PASS" | tee -a "$summary"
          else
            echo "full_gate=FAIL" | tee -a "$summary"
          fi
          commit_results
          exit $overall
