name: Sable Cleanup No-Routing Full Control

on:
  push:
    branches:
      - 'agent/validate-sable-cleanup-no-routing-full'
    paths-ignore:
      - 'no-routing-full-results/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run cleanup-only full profile control
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p no-routing-full-results /tmp/no-routing-full
          summary=no-routing-full-results/summary.txt
          : > "$summary"
          echo "validated_sha=${GITHUB_SHA}" >> "$summary"
          bad_re='Could not journal complete Sable destination|Could not journal Sable relocation|SavedData expects a frame|the second body of this constraint is not a sub-level|Could not install host-contact suppression'

          publish_checkpoint() {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add no-routing-full-results
            if ! git diff --cached --quiet; then
              git commit -m '[validation-results] Checkpoint cleanup-only full control'
              git push origin HEAD:agent/validate-sable-cleanup-no-routing-full
            fi
          }

          run_profile() {
            local label="$1"; shift
            local log="/tmp/no-routing-full/${label}.log"
            set +e
            timeout --signal=TERM --kill-after=30s 12m ./gradlew --no-daemon runGameTestServer "$@" --console=plain > "$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then status=PASS; elif [[ $rc -eq 124 || $rc -eq 137 ]]; then status=TIMEOUT; else status=FAIL; fi
            if grep -E "$bad_re" "$log" > "no-routing-full-results/${label}.signatures"; then
              [[ "$status" == PASS ]] && status=FAIL_SIGNATURE
            else
              rm -f "no-routing-full-results/${label}.signatures"
            fi
            echo "${label}=${status}" >> "$summary"
            if [[ "$status" != PASS ]]; then cp "$log" "no-routing-full-results/${label}.log"; fi
            publish_checkpoint
            [[ "$status" == PASS ]]
          }

          echo 'stage=START' >> "$summary"
          publish_checkpoint
          overall=0
          run_profile full-core -Pinclude_create=false -Pinclude_simulated=false || overall=1
          run_profile full-create -Pinclude_create=true -Pinclude_simulated=false || overall=1
          for i in 1 2 3; do
            run_profile "full-simulated-${i}" -Pinclude_create=true -Pinclude_simulated=true || overall=1
          done
          echo "gate=$([[ $overall -eq 0 ]] && echo PASS || echo FAIL)" >> "$summary"
          publish_checkpoint
          exit $overall
