name: Frame Presentation Regression Bisect

on:
  push:
    branches:
      - agent/frame-shell-modes-and-skins
    paths:
      - .github/workflows/frame-presentation-regression-bisect.yml

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: 044c1d57401b3c95a3193d8540f5ec7a97635787
          - label: assembly-persistence
            ref: 623d6749181c8bb6a7acda8b16a34f77963bd983
          - label: be-skin-cache
            ref: 36fc5f13c1640bbfe3acdc4cbd3ef09784cca0b5
          - label: shell-shapes
            ref: 617df3404ba7bc85b195fb268ebf7e54ab2d6944
          - label: origin-repair
            ref: bd6a4361e63eb4c1b7d49b604cf71ca16246d8c4
          - label: manager-lifecycle
            ref: 1e38bf5536a3add383c1f82b3cd8b13e2a0d0f51
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Mask every Antikythera GameTest except foreign-host diagonal kinetic regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          target = 'diagonalSeparateFramesInSameForeignHostUseNativeCogRatio'
          root = Path('src/main/java')
          count = 0
          kept = 0
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(True)
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if re.match(r'^\s*@GameTest(?:\(|\s|$)', line):
                      look = ''.join(lines[i:min(i + 6, len(lines))])
                      if target in look:
                          kept += 1
                          out.append(line)
                      else:
                          count += 1
                          indent = line[:len(line)-len(line.lstrip())]
                          out.append(indent + '// ' + line[len(indent):])
                      i += 1
                      continue
                  out.append(line)
                  i += 1
              path.write_text(''.join(out), encoding='utf-8')
          if kept != 1:
              raise SystemExit(f'expected exactly one target GameTest, found {kept}')
          print(f'masked {count} GameTests; kept {kept}')
          PY
      - name: Run isolated regression
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          timeout --signal=TERM --kill-after=30s 420s ./gradlew --no-daemon runGameTestServer -Pinclude_create=true -Pinclude_simulated=true --console=plain > /tmp/probe.log 2>&1
          status=$?
          set -e
          {
            echo "label=${{ matrix.label }}"
            echo "ref=${{ matrix.ref }}"
            echo "exit_code=${status}"
            grep -Ei 'tests are now running|GAME TESTS COMPLETE|required tests failed|diagonalseparateframesinsameforeignhostusenativecogratio|passed!|failed!|BUILD (SUCCESSFUL|FAILED)|Exception|ERROR|Caused by|FREEZE DUMP' /tmp/probe.log | tail -n 180 || true
            echo "--- tail ---"
            tail -n 160 /tmp/probe.log || true
          } > regression-${{ matrix.label }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.label }}
          path: regression-${{ matrix.label }}.txt

  collect:
    if: always()
    needs: [probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-shell-modes-and-skins
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: regression-*
          merge-multiple: true
          path: /tmp/results
      - name: Record bisect and remove harness
        shell: bash
        run: |
          mkdir -p .validation
          {
            echo "target=diagonalSeparateFramesInSameForeignHostUseNativeCogRatio"
            for label in base assembly-persistence be-skin-cache shell-shapes origin-repair manager-lifecycle; do
              echo
              f="/tmp/results/regression-${label}.txt"
              if [ -f "$f" ]; then cat "$f"; else echo "MISSING ${label}"; fi
            done
          } > .validation/frame-presentation-regression-bisect.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frame-presentation-regression-bisect.yml
          git add .validation/frame-presentation-regression-bisect.txt
          git commit -m "Record frame presentation regression bisect"
          git push origin HEAD:agent/frame-shell-modes-and-skins
